<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hemis Ball Kalkulyator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .title-font { font-family: 'Poppins', sans-serif; }
    .hero-bg { background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%); }
  </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen">

  <!-- ====================== BOSH SAHIFA ====================== -->
  <div id="homeScreen" class="hero-bg min-h-screen flex flex-col">
    <div class="flex justify-end gap-4 px-6 py-6">
      <button onclick="showLogin()" class="px-8 py-3 bg-white/10 hover:bg-white/20 rounded-2xl font-medium">Kirish</button>
      <button onclick="showRegister()" class="px-8 py-3 bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-950 font-bold rounded-2xl">Ro'yxatdan o'tish</button>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="mb-8">
        <span class="text-6xl">🎓</span>
      </div>
      <h1 class="title-font text-6xl font-bold tracking-tight mb-4 text-white">
        HEMIS BALL<br><span class="text-yellow-400">KALKULYATOR</span>
      </h1>
      <p class="text-blue-200 text-xl max-w-md mb-12">
        O'z baholaringizni osongina hisoblang va yakuniy imtihon imkoniyatini bilib oling
      </p>

      <button onclick="goToCalculator()" 
              class="px-14 py-6 bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-950 font-bold text-2xl rounded-3xl shadow-2xl hover:scale-105 transition-all">
        Boshlash
      </button>
    </div>
  </div>

  <!-- ====================== HISOBLASH EKRANI ====================== -->
  <div id="calcScreen" class="hidden min-h-screen bg-[#0f172a] flex flex-col">
    <div class="flex justify-between items-center px-6 py-5 border-b border-white/10">
      <button onclick="goBack()" class="text-3xl">←</button>
      <h2 class="title-font text-2xl font-bold">Ball Kalkulyator</h2>
      <div id="currentUser" class="text-yellow-400 font-medium"></div>
    </div>

    <div class="flex-1 p-6 space-y-8 overflow-auto">
      <div class="text-center text-sm text-slate-400 mb-4">Joriy + Oraliq ≥ 36 ball bo‘lsa yakuniy imtihon topshirasiz</div>

      <!-- Joriy Nazorat -->
      <div>
        <label class="block text-lg font-medium mb-3">Joriy Nazorat (JN - 40 ball)</label>
        <input id="jn" type="number" step="0.01" placeholder="Ball yoki % kiriting (mas: 95)"
               class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-6 py-5 text-xl focus:outline-none focus:border-yellow-400"/>
      </div>

      <!-- Oraliq Nazorat -->
      <div>
        <label class="block text-lg font-medium mb-3">Oraliq Nazorat (OR - 20 ball)</label>
        <input id="or" type="number" step="0.01" placeholder="Ball yoki % kiriting (mas: 95)"
               class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-6 py-5 text-xl focus:outline-none focus:border-yellow-400"/>
      </div>

      <!-- Yakuniy Nazorat -->
      <div>
        <label class="block text-lg font-medium mb-3">Yakuniy Nazorat (YN - 40 ball)</label>
        <input id="yn" type="number" step="0.01" placeholder="Ball yoki % kiriting (ixtiyoriy)"
               class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-6 py-5 text-xl focus:outline-none focus:border-yellow-400"/>
      </div>
    </div>

    <div class="p-6 bg-[#0f172a] border-t border-white/10">
      <button onclick="hisobla()" 
              class="w-full py-7 bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-950 font-bold text-2xl rounded-3xl shadow-xl hover:scale-105 transition-all">
        HISOBLASH
      </button>
    </div>
  </div>

  <!-- ====================== RO'YXATDAN O'TISH MODAL ====================== -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 rounded-3xl w-full max-w-md">
      <div class="p-8">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-3xl font-bold text-yellow-400">Talaba Ro'yxati</h2>
          <button onclick="hideRegister()" class="text-4xl text-slate-400">×</button>
        </div>

        <div class="space-y-6">
          <input id="fullName" type="text" placeholder="Ism va Familiya" 
                 class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-5 text-lg"/>

          <div>
            <select id="university" class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-5 text-lg">
              <option value="">OTM ni tanlang</option>
              <option value="Qo'qon universiteti Andijon filiali">(KUAF) Qo'qon universiteti Andijon filiali</option>
              <option value="Andijon davlat universiteti">(ADU) Andijon davlat universiteti</option>
              <option value="Andijon mashinasozlik instituti">Andijon mashinasozlik instituti</option>
              <option value="Toshkent davlat universiteti">Toshkent davlat universiteti</option>
            </select>
          </div>

          <input id="password" type="password" placeholder="Parol" 
                 class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-5 text-lg"/>
          
          <div class="relative">
            <input id="confirmPassword" type="password" placeholder="Parolni tasdiqlash" 
                   class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-5 text-lg"/>
            <button onclick="togglePassword()" 
                    class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
              👁
            </button>
          </div>
        </div>

        <button onclick="registerUser()" 
                class="mt-10 w-full py-6 bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-950 font-bold text-xl rounded-3xl">
          Ro'yxatdan o'tish
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let isPasswordVisible = false;

    function showRegister() {
      document.getElementById('registerModal').classList.remove('hidden');
    }

    function hideRegister() {
      document.getElementById('registerModal').classList.add('hidden');
    }

    function togglePassword() {
      isPasswordVisible = !isPasswordVisible;
      const passField = document.getElementById('confirmPassword');
      passField.type = isPasswordVisible ? 'text' : 'password';
    }

    function registerUser() {
      const name = document.getElementById('fullName').value.trim();
      const uni = document.getElementById('university').value;
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (!name || !uni || !pass || !confirmPass) {
        alert("Barcha maydonlarni to'ldiring!");
        return;
      }

      if (pass !== confirmPass) {
        alert("Parollar mos kelmadi! Qayta tekshiring.");
        return;
      }

      currentUser = { name: name, university: uni };
      hideRegister();

      alert(`🎉 Tabriklaymiz, ${name.split(' ')[0]}!\nSiz muvaffaqiyatli ro'yxatdan o'tdingiz.`);
      
      // Ro'yxatdan o'tgandan keyin hisoblash ekranini ochish
      goToCalculator();
    }

    function showLogin() {
      const name = prompt("Ism va Familiyangizni kiriting:");
      if (name && name.trim()) {
        currentUser = { name: name.trim() };
        alert(`Xush kelibsiz, ${name.split(' ')[0]}!`);
      }
    }

    function goToCalculator() {
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('calcScreen').classList.remove('hidden');
      
      if (currentUser) {
        document.getElementById('currentUser').textContent = currentUser.name.split(' ')[0];
      }
    }

    function goBack() {
      document.getElementById('calcScreen').classList.add('hidden');
      document.getElementById('homeScreen').classList.remove('hidden');
    }

    function hisobla() {
      const jnInput = parseFloat(document.getElementById('jn').value) || 0;
      const orInput = parseFloat(document.getElementById('or').value) || 0;
      const ynInput = parseFloat(document.getElementById('yn').value) || 0;

      // Foizni ballga aylantirish
      const jn = (jnInput > 100) ? Math.min(jnInput, 40) : (jnInput / 100) * 40;
      const or = (orInput > 100) ? Math.min(orInput, 20) : (orInput / 100) * 20;
      const yn = (ynInput > 100) ? Math.min(ynInput, 40) : (ynInput / 100) * 40;

      const total = (jn + or + yn).toFixed(1);
      const jnOrSum = (jn + or).toFixed(1);

      let message = `Jami ball: ${total}\n\n`;
      message += `Joriy + Oraliq: ${jnOrSum} ball\n\n`;

      if (parseFloat(jnOrSum) >= 36) {
        message += "✅ Siz yakuniy imtihonni topshira olasiz!\nImtihonda omad tilaymiz!";
      } else {
        const needed = (36 - parseFloat(jnOrSum)).toFixed(1);
        message += `❌ Yakuniy imtihon uchun yana ${needed} ball yetishmayapti`;
      }

      alert(message);
    }

    // Enter tugmasi bilan hisoblash
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') hisobla();
    });
  </script>
</body>
</html>

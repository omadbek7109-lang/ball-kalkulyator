<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Cafeteria Pre-order | SmartMenu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #ededed;
            padding: 20px 16px 80px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Modern scroll */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1c1c;
        }
        ::-webkit-scrollbar-thumb {
            background: #2e7d32;
            border-radius: 10px;
        }

        /* Typography */
        h1, h2, h3, p {
            letter-spacing: -0.02em;
        }

        /* App container */
        .screen {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Navigation tabs */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 450px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            padding: 8px 20px;
            border: 0.5px solid rgba(46, 125, 50, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-item.active {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.12);
        }
        .nav-icon {
            font-size: 22px;
        }

        /* Cards */
        .card {
            background: #141414;
            border-radius: 28px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 0.5px solid #2a2a2a;
        }

        /* Buttons */
        .btn-primary {
            background: #2e7d32;
            border: none;
            padding: 14px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
        }
        .btn-primary:active { transform: scale(0.97); background: #1b5e20;}

        .btn-outline {
            background: transparent;
            border: 1px solid #2e7d32;
            padding: 10px 16px;
            border-radius: 32px;
            color: #4caf50;
            font-weight: 500;
            cursor: pointer;
        }

        /* language switch */
        .lang-switch {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: #1e1e1e;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: #bbb;
            font-weight: 500;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #2e7d32;
            color: white;
        }

        /* food grid */
        .food-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .food-item {
            background: #101010;
            border-radius: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 12px;
            border: 0.5px solid #2c2c2c;
        }
        .food-img {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            object-fit: cover;
            background: #1f1f1f;
        }
        .food-info {
            flex: 1;
        }
        .food-name {
            font-weight: 700;
            font-size: 17px;
        }
        .food-price {
            color: #4caf50;
            font-weight: 600;
            margin-top: 4px;
        }
        .add-btn {
            background: #2e7d32;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 30px;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }
        .category-filter {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }
        .chip {
            background: #1f1f1f;
            padding: 8px 18px;
            border-radius: 40px;
            white-space: nowrap;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chip.active {
            background: #2e7d32;
            color: white;
        }

        /* roulette wheel */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2e7d32;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-weight: bold;
            color: white;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }
        .timer-text {
            text-align: center;
            margin-top: 12px;
            font-family: monospace;
            font-size: 18px;
        }

        /* cart item */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .qty-control {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .qty-btn {
            background: #2a2a2a;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            font-size: 18px;
            color: white;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 450px) {
            body { padding: 16px 12px 80px; }
        }
    </style>
</head>
<body>

<div id="app"></div>

<script>
    // ---------- MULTI LANGUAGE DICTIONARY ----------
    const translations = {
        uz: {
            greeting: "Salom",
            balance: "Cashback balans",
            randomBtn: "🎡 Nima yeyishni bilmayapsiz?",
            categories: ["Barchasi", "Osh", "Fast food", "Ichimliklar"],
            orderBtn: "Buyurtma berish", spinAgain: "Yana aylantirish",
            cartTitle: "Savat", total: "Jami", cashbackInfo: "Cashback (5%)", finalPrice: "Yakuniy",
            payment: "To‘lovga o‘tish", paymentOptions: "To‘lov usuli", confirmPay: "To‘lovni tasdiqlash",
            successMsg: "To‘lov muvaffaqiyatli! +5% cashback qo‘shildi",
            ordersTitle: "Buyurtmalar tarixi", statusPending: "Qabul qilindi", statusPrep: "Tayyorlanmoqda", statusReady: "Tayyor",
            profileTitle: "Profil", nameLabel: "Ism", phoneLabel: "Telefon", cashbackLabel: "Cashback",
            language: "Til", addToCart: "Qo‘shish"
        },
        ru: {
            greeting: "Здравствуйте",
            balance: "Кешбэк баланс",
            randomBtn: "🎡 Не знаете, что поесть?",
            categories: ["Все", "Плов", "Фастфуд", "Напитки"],
            orderBtn: "Заказать", spinAgain: "Крутить снова",
            cartTitle: "Корзина", total: "Итого", cashbackInfo: "Кешбэк (5%)", finalPrice: "Итоговая цена",
            payment: "Перейти к оплате", paymentOptions: "Способ оплаты", confirmPay: "Подтвердить оплату",
            successMsg: "Оплата успешна! +5% кешбэк начислен",
            ordersTitle: "История заказов", statusPending: "Принят", statusPrep: "Готовится", statusReady: "Готов",
            profileTitle: "Профиль", nameLabel: "Имя", phoneLabel: "Телефон", cashbackLabel: "Кешбэк",
            language: "Язык", addToCart: "Добавить"
        }
    };

    let lang = "uz";
    let currentUser = null;
    let cart = []; // {id, name, price, quantity, image}
    let orders = [];
    let cashbackBalance = 0;
    let rouletteItems = [];
    let spinCooldown = false;
    let spinTimer = null;

    // Food database
    const FOODS = [
        { id: "lagman", name_uz: "Lagman", name_ru: "Лагман", price: 28000, category: "Osh", image: "https://picsum.photos/id/127/100/100", desc_uz: "Mazali lagman", desc_ru: "Вкусный лагман" },
        { id: "osh", name_uz: "Palov", name_ru: "Плов", price: 32000, category: "Osh", image: "https://picsum.photos/id/128/100/100", desc_uz: "An'anaviy palov", desc_ru: "Традиционный плов" },
        { id: "burger", name_uz: "Burger", name_ru: "Бургер", price: 25000, category: "Fast food", image: "https://picsum.photos/id/129/100/100", desc_uz: "Double patty", desc_ru: "Двойная котлета" },
        { id: "pizza", name_uz: "Pizza", name_ru: "Пицца", price: 45000, category: "Fast food", image: "https://picsum.photos/id/130/100/100", desc_uz: "Pepperoni", desc_ru: "Пепперони" },
        { id: "somsa", name_uz: "Somsa", name_ru: "Самса", price: 8000, category: "Fast food", image: "https://picsum.photos/id/131/100/100", desc_uz: "Tandir somsa", desc_ru: "Тандыр самса" },
        { id: "coca", name_uz: "Coca-Cola", name_ru: "Кока-Кола", price: 7000, category: "Ichimliklar", image: "https://picsum.photos/id/132/100/100", desc_uz: "Sovuq ichimlik", desc_ru: "Холодный напиток" },
        { id: "ayran", name_uz: "Ayran", name_ru: "Айран", price: 5000, category: "Ichimliklar", image: "https://picsum.photos/id/133/100/100", desc_uz: "Tabiiy", desc_ru: "Натуральный" }
    ];

    function t(key, fallback = "") {
        return translations[lang][key] || fallback;
    }

    function getFoodName(food) {
        return lang === "uz" ? food.name_uz : food.name_ru;
    }

    function getDesc(food) {
        return lang === "uz" ? food.desc_uz : food.desc_ru;
    }

    // initialize roulette items from first 5 foods
    function initRoulette() {
        rouletteItems = FOODS.slice(0,5);
    }

    // localStorage
    function saveUserData() {
        if(currentUser) {
            localStorage.setItem("cafe_user", JSON.stringify({
                name: currentUser.name,
                phone: currentUser.phone,
                cashback: cashbackBalance,
                orders: orders
            }));
        }
        localStorage.setItem("cafe_cart", JSON.stringify(cart));
        localStorage.setItem("cafe_lang", lang);
    }

    function loadUserData() {
        const saved = localStorage.getItem("cafe_user");
        if(saved) {
            try {
                const u = JSON.parse(saved);
                currentUser = { name: u.name, phone: u.phone };
                cashbackBalance = u.cashback || 0;
                orders = u.orders || [];
            } catch(e) {}
        }
        const savedCart = localStorage.getItem("cafe_cart");
        if(savedCart) cart = JSON.parse(savedCart);
        const savedLang = localStorage.getItem("cafe_lang");
        if(savedLang === "ru" || savedLang === "uz") lang = savedLang;
    }

    function renderAuthScreen() {
        return `
            <div class="card" style="margin-top: 40px;">
                <h2 style="margin-bottom: 24px;">🍽️ SmartMenu</h2>
                <input type="text" id="userName" placeholder="Ismingiz / Ваше имя" class="card" style="width:100%; background:#1e1e1e; border:none; color:white;" />
                <input type="tel" id="userPhone" placeholder="+998 XX XXX XX XX" class="card" style="width:100%; margin-top:12px; background:#1e1e1e; border:none; color:white;" />
                <button id="authSubmitBtn" class="btn-primary" style="margin-top: 24px;">Kirish / Вход</button>
            </div>
        `;
    }

    function validatePhone(phone) {
        const digits = phone.replace(/\\D/g, '');
        return digits.length === 12 && phone.startsWith('+998');
    }

    function setScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        const scr = document.getElementById(screenId);
        if(scr) scr.classList.add('active');
    }

    // core functions: update cart, home, cartScreen...
    function addToCart(foodId) {
        const food = FOODS.find(f => f.id === foodId);
        if(!food) return;
        const existing = cart.find(i => i.id === foodId);
        if(existing) existing.quantity++;
        else cart.push({ id: food.id, name_uz: food.name_uz, name_ru: food.name_ru, price: food.price, quantity: 1, image: food.image });
        saveUserData();
        renderAllScreens();
    }

    function updateCartUI() { if(document.getElementById('cartScreen')) renderCartScreen(); renderOrdersBadge();}
    function renderOrdersBadge() {}

    function getTotalCart() { return cart.reduce((sum, i) => sum + i.price * i.quantity, 0); }

    function renderCartScreen() {
        const container = document.getElementById('cart-list');
        if(!container) return;
        if(cart.length === 0) { container.innerHTML = "<p class='card'>Savat bo‘sh / Корзина пуста</p>"; document.getElementById('cart-total').innerHTML = "0"; document.getElementById('cart-final').innerHTML = "0"; return; }
        let html = "";
        cart.forEach((item, idx) => {
            html += `<div class="cart-item"><div><b>${lang==='uz'?item.name_uz:item.name_ru}</b><br/>${item.price} so'm</div>
            <div class="qty-control"><button class="qty-btn" data-idx="${idx}" data-delta="-1">-</button><span>${item.quantity}</span><button class="qty-btn" data-idx="${idx}" data-delta="1">+</button></div></div>`;
        });
        container.innerHTML = html;
        const total = getTotalCart();
        const cashbackAmount = total * 0.05;
        const finalPrice = total;
        document.getElementById('cart-total').innerText = total;
        document.getElementById('cart-cashback').innerText = Math.floor(cashbackAmount);
        document.getElementById('cart-final').innerText = finalPrice;
        document.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                const delta = parseInt(btn.dataset.delta);
                if(cart[idx]) {
                    cart[idx].quantity += delta;
                    if(cart[idx].quantity <= 0) cart.splice(idx,1);
                    saveUserData();
                    renderCartScreen();
                    if(document.getElementById('homeScreen') && document.getElementById('homeScreen').classList.contains('active')) renderHomeScreen();
                }
            });
        });
    }

    function renderHomeScreen() {
        if(!currentUser) return;
        const greeting = `${t('greeting')}, ${currentUser.name}!`;
        document.getElementById('greetingMsg').innerHTML = greeting;
        document.getElementById('balanceVal').innerHTML = cashbackBalance;
        document.getElementById('randomSpinBtnHome').innerHTML = t('randomBtn');
        // categories
        let catsHtml = "";
        const categoriesAll = t('categories');
        let activeCat = window.currentCat || "Barchasi";
        categoriesAll.forEach(cat => {
            catsHtml += `<div class="chip ${activeCat===cat?'active':''}" data-cat="${cat}">${cat}</div>`;
        });
        document.getElementById('categoryChips').innerHTML = catsHtml;
        // filter
        const filterKey = activeCat === "Barchasi" ? "" : activeCat;
        let filtered = FOODS;
        if(filterKey === "Osh") filtered = FOODS.filter(f => f.category === "Osh");
        else if(filterKey === "Fast food") filtered = FOODS.filter(f => f.category === "Fast food");
        else if(filterKey === "Ichimliklar") filtered = FOODS.filter(f => f.category === "Ichimliklar");
        let foodsHtml = "";
        filtered.forEach(f => {
            foodsHtml += `<div class="food-item"><img class="food-img" src="${f.image}" /><div class="food-info"><div class="food-name">${getFoodName(f)}</div><div class="food-price">${f.price} so'm</div></div><button class="add-btn" data-id="${f.id}">+</button></div>`;
        });
        document.getElementById('foodList').innerHTML = foodsHtml;
        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { addToCart(btn.dataset.id); renderHomeScreen(); });
        });
        document.querySelectorAll('.chip').forEach(ch => {
            ch.addEventListener('click', () => { window.currentCat = ch.innerText; renderHomeScreen(); });
        });
    }

    function renderSpinScreen() {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const size = 280;
        canvas.width = size; canvas.height = size;
        const segments = rouletteItems;
        const angleStep = (Math.PI * 2) / segments.length;
        let startAngle = 0;
        segments.forEach((item, i) => {
            const endAngle = startAngle + angleStep;
            ctx.beginPath();
            ctx.fillStyle = i % 2 === 0 ? '#1b3b1f' : '#2e7d32';
            ctx.moveTo(size/2, size/2);
            ctx.arc(size/2, size/2, size/2, startAngle, endAngle);
            ctx.fill();
            ctx.save();
            ctx.translate(size/2, size/2);
            ctx.rotate(startAngle + angleStep/2);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Inter';
            ctx.fillText(getFoodName(item).slice(0,6), 70, 8);
            ctx.restore();
            startAngle = endAngle;
        });
        document.getElementById('spinBtn').disabled = spinCooldown;
        if(spinCooldown){
            document.getElementById('spinTimerText').innerHTML = "⌛ kutib turing";
        } else {
            document.getElementById('spinTimerText').innerHTML = "🎡 Aylantirish tayyor";
        }
    }

    let spinning = false;
    function spinRoulette() {
        if(spinCooldown || spinning) return;
        spinning = true;
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentRotation = 0;
        const totalSpin = Math.random() * 20 + 20;
        let animFrame;
        const spinStep = () => {
            currentRotation += 0.3;
            if(currentRotation >= totalSpin) {
                cancelAnimationFrame(animFrame);
                const finalSegment = Math.floor(Math.random() * rouletteItems.length);
                const result = rouletteItems[finalSegment];
                spinning = false;
                spinCooldown = true;
                document.getElementById('spinBtn').disabled = true;
                let timer = 60;
                const interval = setInterval(() => {
                    timer--;
                    document.getElementById('spinTimerText').innerHTML = `⏱️ 00:${timer<10?'0'+timer:timer}`;
                    if(timer <= 0) {
                        clearInterval(interval);
                        spinCooldown = false;
                        document.getElementById('spinBtn').disabled = false;
                        document.getElementById('spinTimerText').innerHTML = "🎡 Aylantirish";
                    }
                }, 1000);
                showResultScreen(result);
                return;
            }
            drawWheelAtRotation(currentRotation);
            animFrame = requestAnimationFrame(spinStep);
        };
        function drawWheelAtRotation(rot){
            ctx.clearRect(0,0,size,size);
            let start = rot;
            segments.forEach((item,i)=>{
                const end = start+angleStep;
                ctx.beginPath();
                ctx.fillStyle = i%2===0?'#1b3b1f':'#2e7d32';
                ctx.moveTo(size/2,size/2);
                ctx.arc(size/2,size/2,size/2,start,end);
                ctx.fill();
                ctx.save();
                ctx.translate(size/2,size/2);
                ctx.rotate(start+angleStep/2);
                ctx.fillStyle='white';
                ctx.font='bold 13px Inter';
                ctx.fillText(getFoodName(item).slice(0,5), 65,6);
                ctx.restore();
                start = end;
            });
        }
        const size = 280, segments=rouletteItems, angleStep = (Math.PI*2)/segments.length;
        drawWheelAtRotation(0);
        animFrame = requestAnimationFrame(spinStep);
    }

    function showResultScreen(food) {
        setScreen('resultScreen');
        document.getElementById('resultImg').src = food.image;
        document.getElementById('resultName').innerText = getFoodName(food);
        document.getElementById('resultPrice').innerText = food.price + " so'm";
        document.getElementById('resultDesc').innerText = getDesc(food);
        const buyBtn = document.getElementById('orderFromResult');
        const againBtn = document.getElementById('spinAgainBtn');
        buyBtn.onclick = () => { addToCart(food.id); setScreen('homeScreen'); renderHomeScreen(); };
        againBtn.onclick = () => { setScreen('spinScreen'); renderSpinScreen(); };
    }

    function renderPaymentScreen() {
        const total = getTotalCart();
        document.getElementById('payTotalAmount').innerText = total;
        document.getElementById('confirmPayBtn').onclick = () => {
            if(cart.length===0) return;
            const cashbackEarned = Math.floor(total*0.05);
            cashbackBalance += cashbackEarned;
            const newOrder = {
                id: Date.now(),
                items: [...cart],
                total: total,
                date: new Date().toLocaleString(),
                status: 'Qabul qilindi'
            };
            orders.unshift(newOrder);
            cart = [];
            saveUserData();
            renderSuccessScreen(cashbackEarned);
        };
    }

    function renderSuccessScreen(earned) {
        setScreen('successScreen');
        document.getElementById('successMsg').innerHTML = t('successMsg');
        document.getElementById('cashbackAdded').innerHTML = `+${earned} cashback`;
    }

    function renderOrdersScreen() {
        const container = document.getElementById('ordersList');
        if(!container) return;
        if(orders.length===0){ container.innerHTML="<div class='card'>Buyurtmalar yo‘q</div>"; return;}
        let html="";
        orders.forEach(o=>{
            html+=`<div class='card'><b>#${o.id}</b> - ${o.date}<br/>Jami: ${o.total} so'm <br/>Status: ${o.status}</div>`;
        });
        container.innerHTML=html;
    }

    function renderProfileScreen() {
        if(!currentUser) return;
        document.getElementById('profileName').innerText = currentUser.name;
        document.getElementById('profilePhone').innerText = currentUser.phone;
        document.getElementById('profileCashback').innerText = cashbackBalance;
    }

    function renderAllScreens() {
        if(!currentUser){ document.getElementById('authScreen').innerHTML = renderAuthScreen(); setScreen('authScreen'); 
            document.getElementById('authSubmitBtn')?.addEventListener('click',()=>{
                const name = document.getElementById('userName').value.trim();
                const phone = document.getElementById('userPhone').value.trim();
                if(!name || !validatePhone(phone)) { alert("Ism va to‘liq +998XXXXXXXXX telefon kiriting"); return; }
                currentUser = { name, phone };
                cashbackBalance = 0; orders = []; cart = [];
                saveUserData();
                renderAllScreens();
            }); return;
        }
        renderHomeScreen(); renderCartScreen(); renderSpinScreen(); renderOrdersScreen(); renderProfileScreen(); renderPaymentScreen();
        setScreen('homeScreen');
    }

    function attachNavEvents() {
        const navs = ['homeNav','cartNav','spinNav','ordersNav','profileNav'];
        navs.forEach(id=>{
            const el = document.getElementById(id);
            if(el) el.onclick = ()=>{
                if(id==='homeNav') setScreen('homeScreen');
                if(id==='cartNav') { renderCartScreen(); setScreen('cartScreen'); }
                if(id==='spinNav') { renderSpinScreen(); setScreen('spinScreen');}
                if(id==='ordersNav') { renderOrdersScreen(); setScreen('ordersScreen');}
                if(id==='profileNav') { renderProfileScreen(); setScreen('profileScreen');}
            };
        });
        document.getElementById('randomSpinBtnHome')?.addEventListener('click', ()=>{ setScreen('spinScreen'); renderSpinScreen(); });
        document.getElementById('paymentNavBtn')?.addEventListener('click', ()=>{ renderPaymentScreen(); setScreen('paymentScreen'); });
        document.getElementById('spinBtn')?.addEventListener('click', spinRoulette);
    }

    function initHtml() {
        document.getElementById('app').innerHTML = `
        <div class="lang-switch"><button class="lang-btn ${lang==='uz'?'active':''}" data-lang="uz">UZ</button><button class="lang-btn ${lang==='ru'?'active':''}" data-lang="ru">RU</button></div>
        <div id="authScreen" class="screen active"></div>
        <div id="homeScreen" class="screen"><div class="card"><div id="greetingMsg"></div><div>💰 <span id="balanceVal"></span> so'm</div><button id="randomSpinBtnHome" class="btn-outline" style="margin-top:12px;"></button></div><div id="categoryChips" class="category-filter"></div><div id="foodList" class="food-grid"></div></div>
        <div id="cartScreen" class="screen"><h2>🛒 ${t('cartTitle')}</h2><div id="cart-list"></div><div class="card">${t('total')}: <span id="cart-total">0</span> so'm<br/>${t('cashbackInfo')}: <span id="cart-cashback">0</span><br/><strong>${t('finalPrice')}: <span id="cart-final">0</span> so'm</strong><br/><button id="paymentNavBtn" class="btn-primary" style="margin-top:14px;">${t('payment')}</button></div></div>
        <div id="spinScreen" class="screen"><h2>🎡 Roulette</h2><div class="wheel-container"><canvas id="wheelCanvas" width="280" height="280"></canvas><button id="spinBtn" class="spin-btn">Ayla</button></div><div id="spinTimerText" class="timer-text"></div></div>
        <div id="resultScreen" class="screen"><div class="card"><img id="resultImg" width="120" style="border-radius:32px"/><h2 id="resultName"></h2><h3 id="resultPrice"></h3><p id="resultDesc"></p><button id="orderFromResult" class="btn-primary">${t('orderBtn')}</button><button id="spinAgainBtn" class="btn-outline" style="margin-top:12px;">${t('spinAgain')}</button></div></div>
        <div id="paymentScreen" class="screen"><h2>💳 ${t('paymentOptions')}</h2><div class="card"><p>Click | Payme | Uzcard | Naqd</p><div>Jami: <span id="payTotalAmount"></span> so'm</div><button id="confirmPayBtn" class="btn-primary">${t('confirmPay')}</button></div></div>
        <div id="successScreen" class="screen"><div class="card"><h2>✅ ${t('successMsg')}</h2><p id="cashbackAdded"></p><button onclick="location.reload()" class="btn-primary">Yangi buyurtma</button></div></div>
        <div id="ordersScreen" class="screen"><h2>📋 ${t('ordersTitle')}</h2><div id="ordersList"></div></div>
        <div id="profileScreen" class="screen"><div class="card"><h3>👤 ${t('profileTitle')}</h3><p>${t('nameLabel')}: <span id="profileName"></span></p><p>${t('phoneLabel')}: <span id="profilePhone"></span></p><p>💰 ${t('cashbackLabel')}: <span id="profileCashback"></span> so'm</p></div></div>
        <div class="bottom-nav"><button class="nav-item" id="homeNav">🏠 Bosh</button><button class="nav-item" id="cartNav">🛒 Savat</button><button class="nav-item" id="spinNav">🎡 Aylantir</button><button class="nav-item" id="ordersNav">📋 Buyurtma</button><button class="nav-item" id="profileNav">👤 Profil</button></div>`;
        attachNavEvents();
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                lang = btn.dataset.lang;
                localStorage.setItem('cafe_lang', lang);
                renderAllScreens();
                initHtml(); // refresh full UI
            });
        });
        loadUserData();
        initRoulette();
        renderAllScreens();
    }
    initHtml();
</script>
</body>
</html>

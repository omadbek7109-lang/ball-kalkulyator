<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>O‘zbekiston eng yangi tarixi - Yakuniy test 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.95); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-out {
            animation: fadeOut 0.2s ease forwards;
        }
        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
        .correct-flash {
            background-color: #22c55e !important;
            transition: 0.1s;
        }
        .wrong-flash {
            background-color: #ef4444 !important;
            transition: 0.1s;
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-800 to-indigo-900 min-h-screen py-4 px-3">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-xl md:text-2xl font-bold text-white">O‘zbekistonning eng yangi tarixi</h1>
            <p class="text-indigo-200 text-sm">Yakuniy nazorat testlari (2026)</p>
            <div class="inline-block bg-white/20 backdrop-blur rounded-full px-3 py-0.5 mt-2 text-xs text-white">
                🔄 Savollar va javoblar har safar aralashtiriladi
            </div>
        </div>

        <!-- Test Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Progress Header -->
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4 text-white">
                <div class="flex justify-between items-center">
                    <span class="font-semibold">📋 Test: <span id="current-num">1</span> / <span id="total-num">0</span></span>
                    <span id="score-badge" class="bg-white/20 px-3 py-1 rounded-full text-sm">⭐ 0 to'g'ri</span>
                </div>
                <div class="w-full bg-white/30 rounded-full h-2 mt-3">
                    <div id="progress-bar" class="bg-yellow-300 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Question Area -->
            <div id="question-area" class="p-5 md:p-6 min-h-[320px]">
                <!-- Dynamic -->
            </div>

            <!-- Feedback Message -->
            <div id="feedback" class="px-5 pb-3 text-center text-sm font-medium hidden">
                <!-- dynamic -->
            </div>

            <!-- Bottom Buttons -->
            <div class="px-5 pb-5 flex gap-3">
                <button id="restart-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-xl transition">🔄 Qayta boshlash</button>
            </div>
        </div>

        <!-- Result Modal -->
        <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
            <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl transform transition-all scale-100">
                <div class="text-5xl mb-2">📊</div>
                <h2 class="text-2xl font-bold text-gray-800">Test yakunlandi!</h2>
                <p class="text-gray-500 mt-1">Sizning natijangiz</p>
                <div class="text-5xl font-bold text-indigo-600 my-2"><span id="final-score">0</span> / <span id="final-total">0</span></div>
                <div class="w-full bg-gray-200 rounded-full h-3 mb-3">
                    <div id="final-bar" class="bg-indigo-600 h-3 rounded-full" style="width: 0%"></div>
                </div>
                <p id="congrats" class="text-sm text-gray-500 mb-4">Yana bir bor sinab ko‘ring!</p>
                <button id="modal-restart" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-xl transition w-full">🔄 Yangi test</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== TO‘LIQ SAVOLLAR (real variantlar bilan) ====================
        const rawQuestions = [
            { text: "Mustaqillik qo'lga kiritilgunga qadar O'zbekiston davlatchilik tarixi eng qadimgi davrdan boshlab nechta taraqqiyot bosqichiga bo'lingan edi?", options: ["3 ta", "5 ta", "2 ta", "4 ta"], correct: "4 ta" },
            { text: "Tariximizning yozuvsiz zamonlarga oid davrini o'rganishda qaysi manbalar yordamga keladi?", options: ["Moddiy va yozma manbalar", "Yozma va arxiv manbalari", "Arxeologik va yozma manbalar", "Arxeologik, antropologik va etnografik manbalar"], correct: "Arxeologik, antropologik va etnografik manbalar" },
            { text: "Quyidagi javoblar ichidan O'zbekiston tarixi fanining ilmiy-nazariy uslublari va tamoyillari to'g'ri keltirilgan javobni toping", options: ["Tarixiy hodisa va voqealarni, hujjat va faktlarni ilmiy, xolisona o'rganish va tahlil qilish", "Tarixni milliylik va umuminsoniylik asosida o'rganish va tahlil qilish", "Tarixni haqqoniy, tarixiy-falsafiy mantiqiylik asosida o'rganish va yozish", "Barcha javoblar to'g'ri"], correct: "Barcha javoblar to'g'ri" },
            { text: "Nima sababdan O'zbekiston tarixi fanini o'rganishda tarixiy manbalarning o'rni va ahamiyati katta?", options: ["Manbalar tarixni tilga kiritadi", "Haqqoniy tarix faqatgina yozma manbalarda yozib qoldirilgan", "Inson qo'li va aql-zakovati bilan yaratilganligi uchun", "To'g'ri javob yo'q"], correct: "To'g'ri javob yo'q" },
            { text: "Manbalar o'z holatiga ko'ra qanday ko'rinishlarga ega bo'ladi?", options: ["Arxeologik va moddiy", "Yozma va moddiy", "Etnografik va moddiy-ashyoviy", "Yozma va arxiv manbalari"], correct: "Yozma va moddiy" },
            { text: "Birlamchi manbaga nimalar kiradi?", options: ["Moddiy manbalar", "Yozma manbalar", "Tarixiy hujjatlarning asl nusxasi", "Kitoblar va adabiyotlar"], correct: "Tarixiy hujjatlarning asl nusxasi" },
            { text: "O'zbekiston Respublikasida yoshlarning ijtimoiy-iqtisodiy, siyosiy va huquqiy kafolatlari qaysi qonunda belgilab qo'yilgan?", options: ["Ta'lim to'g'risida", "Kadrlar tayyorlash milliy dasturi", "O'zbekistonda yoshlarga oid davlat siyosatining asoslari to'g'risida", "Yoshlar to'g'risida"], correct: "O'zbekistonda yoshlarga oid davlat siyosatining asoslari to'g'risida" },
            { text: "Farg'ona fojiali voqealari qachon sodir bo'ldi?", options: ["1985-1987 yilning may oyida", "1990-yilning iyun-iyul oylarida", "1989-yilning may-iyun oylarida", "1991 yilning sentabr oyida"], correct: "1989-yilning may-iyun oylarida" },
            { text: "O'zbekiston Respublikasining boshqaruv shakliga ko'ra...", options: ["Prezidentlik Respublikasi", "Monarxiya davlati", "Konstitutsion monarxiya", "Parlamentar Respublika"], correct: "Prezidentlik Respublikasi" },
            { text: "Quyidagi davlatlardan qaysi biri O'zbekistonning mustaqilligini birinchilardan bo'lib tan olgan?", options: ["AQSH", "Turkiya", "Eron", "Xitoy"], correct: "Turkiya" },
            { text: "O'zbekiston Respublikasi Prezidenti Shavkat Mirziyoyev 2017-yil 27-martda kimning 100 yilligini nishonlash to'g'risida qaror imzolagan?", options: ["Ozod Sharafiddinov", "Sharof Rashidov", "Jaloliddin Manguberdi", "Amir Temur"], correct: "Sharof Rashidov" },
            { text: "O'zbekiston Respublikasida yoshlarning aholi tarkibidagi salmog'i qancha?", options: ["50 foiz", "50 foizdan yuqori", "60 foizdan yuqori", "70 foiz"], correct: "50 foizdan yuqori" },
            { text: "Qayta qurish siyosati qachon boshlandi?", options: ["1985 yil SSSR MK 23-aprel plenumidan so'ng", "1989 yil SSSR MK XXV syezdidan so'ng", "1990 yil mustaqillik deklaratsiyasidan so'ng", "1980-1985 yillarda Gorbachev boshchiligida"], correct: "1985 yil SSSR MK 23-aprel plenumidan so'ng" },
            { text: "Islom Karimov O'zbekiston rahbari sifatida faoliyatini qachon boshladi?", options: ["1989-yil 23-iyun", "1990-yil 20-iyun", "1991-yil 1-sentabr", "1989-yil 20-oktyabr"], correct: "1989-yil 23-iyun" },
            { text: "Mustaqillik arafasida Markazda davlat to'ntarishiga urinish qachon bo'ldi?", options: ["1991-yil 19-avgust", "1989-yil may-iyun", "1985-yil aprel", "1991-yil 19-21 avgust"], correct: "1991-yil 19-21 avgust" },
            { text: "Paxta ishi va o'zbeklar ishi qachon boshlandi?", options: ["XX asr 90-yillar", "XX asr 80-yillar", "XX asr 70-yillar", "XX asr 60-yillar"], correct: "XX asr 80-yillar" },
            { text: "Prezidentlik lavozimi ta'sis etish qachon qabul qilindi?", options: ["1990-yil 24-mart", "1990-yil 20-iyun", "1990-yil 10-dekabr", "1991-yil 29-dekabr"], correct: "1990-yil 24-mart" },
            { text: "Mustaqillik Deklaratsiyasi qachon qabul qilindi?", options: ["1990-yil 20-iyun", "1990-yil 24-mart", "1990-yil 10-dekabr", "1991-yil 31-avgust"], correct: "1990-yil 20-iyun" },
            { text: "Mustaqillik Deklaratsiyasi necha moddadan iborat?", options: ["12", "10", "17", "15"], correct: "15" },
            { text: "O'zbekiston Respublikasi Konstitutsiyasi qachon qabul qilingan?", options: ["1991-yil 8-dekabr", "1990-yil 20-iyun", "1992-yil 8-dekabr", "1991-yil 31-avgust"], correct: "1992-yil 8-dekabr" }
        ];

        let allQuestions = [...rawQuestions];
        const TOTAL = allQuestions.length;

        // Global state
        let shuffledQuestions = [];     // random order of questions
        let userAnswers = new Array(TOTAL).fill(null);
        let currentIndex = 0;
        let isLocked = false;           // prevent double click while animating

        // DOM elements
        const questionArea = document.getElementById('question-area');
        const currentNumSpan = document.getElementById('current-num');
        const totalNumSpan = document.getElementById('total-num');
        const scoreBadge = document.getElementById('score-badge');
        const progressBar = document.getElementById('progress-bar');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackDiv = document.getElementById('feedback');
        const resultModal = document.getElementById('result-modal');
        const finalScoreSpan = document.getElementById('final-score');
        const finalTotalSpan = document.getElementById('final-total');
        const finalBar = document.getElementById('final-bar');
        const congratsSpan = document.getElementById('congrats');
        const modalRestart = document.getElementById('modal-restart');

        // Helper: shuffle array
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Shuffle options for a single question
        function shuffleOptions(question) {
            let shuffled = [...question.options];
            return shuffleArray(shuffled);
        }

        // Initialize quiz
        function initQuiz() {
            // Shuffle questions order
            shuffledQuestions = shuffleArray([...allQuestions]);
            // For each question, keep original options but we'll shuffle display order
            userAnswers.fill(null);
            currentIndex = 0;
            isLocked = false;
            feedbackDiv.classList.add('hidden');
            renderQuestion();
            updateStats();
        }

        // Update score and progress
        function updateStats() {
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                if (ans === null) return acc;
                return acc + (ans === shuffledQuestions[idx].correct ? 1 : 0);
            }, 0);
            scoreBadge.innerHTML = `⭐ ${correctCount} to'g'ri`;
            const answered = userAnswers.filter(a => a !== null).length;
            const percent = (answered / TOTAL) * 100;
            progressBar.style.width = `${percent}%`;
        }

        // Render current question with SHUFFLED options
        function renderQuestion() {
            if (currentIndex >= TOTAL) {
                showResults();
                return;
            }
            const q = shuffledQuestions[currentIndex];
            // Shuffle options for this display
            const shuffledOpts = shuffleOptions(q);
            
            let html = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-indigo-500 font-semibold bg-indigo-100 px-3 py-1 rounded-full">Savol ${currentIndex+1}/${TOTAL}</span>
                    </div>
                    <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-5 leading-relaxed">${escapeHtml(q.text)}</h2>
                    <div class="space-y-3">
            `;
            
            const letters = ['A', 'B', 'C', 'D'];
            shuffledOpts.forEach((opt, idx) => {
                const isSelected = (userAnswers[currentIndex] === opt);
                html += `
                    <button class="option-btn w-full text-left p-3 rounded-xl border-2 ${isSelected ? 'bg-indigo-100 border-indigo-500' : 'bg-gray-50 border-gray-200 hover:border-indigo-300'} transition flex items-start gap-3" data-value="${escapeHtml(opt)}">
                        <span class="font-bold text-indigo-600 min-w-[30px]">${letters[idx]}.</span>
                        <span class="flex-1">${escapeHtml(opt)}</span>
                    </button>
                `;
            });
            
            html += `</div></div>`;
            questionArea.innerHTML = html;
            
            // Attach click handlers
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isLocked) return;
                    const selected = btn.getAttribute('data-value');
                    handleAnswer(selected, btn);
                });
            });
            
            totalNumSpan.innerText = TOTAL;
            currentNumSpan.innerText = currentIndex + 1;
        }
        
        function handleAnswer(selected, btnElement) {
            const currentQ = shuffledQuestions[currentIndex];
            const isCorrect = (selected === currentQ.correct);
            
            // Save answer
            userAnswers[currentIndex] = selected;
            updateStats();
            
            // Visual feedback
            isLocked = true;
            
            // Flash color on the selected button
            if (isCorrect) {
                btnElement.classList.add('correct-flash');
                showFeedback("✅ To‘g‘ri javob!", "text-green-600");
            } else {
                btnElement.classList.add('wrong-flash');
                showFeedback(`❌ Noto‘g‘ri! To‘g‘ri javob: ${currentQ.correct}`, "text-red-600");
            }
            
            // Animate out and go to next question
            setTimeout(() => {
                // Remove flash
                btnElement.classList.remove('correct-flash', 'wrong-flash');
                // Move to next question
                if (currentIndex + 1 < TOTAL) {
                    currentIndex++;
                    renderQuestion();
                    isLocked = false;
                    feedbackDiv.classList.add('hidden');
                } else if (currentIndex + 1 === TOTAL) {
                    // This was the last question, finish quiz
                    currentIndex++;
                    isLocked = false;
                    feedbackDiv.classList.add('hidden');
                    showResults();
                } else {
                    isLocked = false;
                }
            }, 600);
        }
        
        function showFeedback(msg, colorClass) {
            feedbackDiv.innerHTML = `<span class="${colorClass} font-medium">${msg}</span>`;
            feedbackDiv.classList.remove('hidden');
        }
        
        function showResults() {
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                if (ans === null) return acc;
                return acc + (ans === shuffledQuestions[idx].correct ? 1 : 0);
            }, 0);
            const percent = Math.round((correctCount / TOTAL) * 100);
            finalScoreSpan.innerText = correctCount;
            finalTotalSpan.innerText = TOTAL;
            finalBar.style.width = `${percent}%`;
            
            if (percent >= 80) congratsSpan.innerHTML = "🎉 Ajoyib! Siz mavzuni mukammal bilasiz!";
            else if (percent >= 60) congratsSpan.innerHTML = "👍 Yaxshi! Yana bir marta takrorlang.";
            else congratsSpan.innerHTML = "📚 Materiallarni qayta o‘rganib, testni takrorlang.";
            
            resultModal.classList.remove('hidden');
        }
        
        function restartQuiz() {
            resultModal.classList.add('hidden');
            initQuiz();
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Event listeners
        restartBtn.addEventListener('click', () => { initQuiz(); });
        modalRestart.addEventListener('click', () => { initQuiz(); resultModal.classList.add('hidden'); });
        
        // Start
        initQuiz();
    </script>
</body>
</html>

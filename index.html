<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>CampusEats | Pre-order University Cafeteria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #0f0f0f 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        /* App Container */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 80px;
            position: relative;
        }

        /* Screens */
        .screen {
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Auth Overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s;
        }

        .auth-overlay.hidden {
            display: none;
        }

        /* Cards */
        .card {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(46, 125, 50, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        /* Inputs */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #1e1e1e;
            border: 1.5px solid #2a2a2a;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .error-message {
            color: #ff5252;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.2);
        }

        .btn-secondary {
            background: transparent;
            border: 1.5px solid #2e7d32;
            padding: 12px 20px;
            border-radius: 60px;
            color: #4caf50;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:active {
            transform: scale(0.97);
            background: rgba(76, 175, 80, 0.1);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 450px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            border: 1px solid rgba(46, 125, 50, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #888;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.15);
        }

        .nav-icon {
            font-size: 22px;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.4);
            transition: all 0.3s;
            z-index: 99;
            border: none;
            font-size: 28px;
        }

        .fab:active {
            transform: scale(0.92);
        }

        /* Food Grid */
        .food-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .food-item {
            background: #111;
            border-radius: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 12px;
            border: 1px solid #2a2a2a;
            transition: all 0.2s;
        }

        .food-item:hover {
            transform: translateX(4px);
            border-color: #4caf50;
        }

        .food-img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
        }

        .food-info {
            flex: 1;
        }

        .food-name {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 4px;
        }

        .food-price {
            color: #4caf50;
            font-weight: 600;
            font-size: 16px;
        }

        .add-btn {
            background: #2e7d32;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        /* Categories */
        .category-filter {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .chip {
            background: #1a1a1a;
            padding: 10px 20px;
            border-radius: 40px;
            white-space: nowrap;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2a2a2a;
        }

        .chip.active {
            background: #2e7d32;
            color: white;
            border-color: #4caf50;
        }

        /* Roulette */
        .roulette-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .roulette-modal.hidden {
            display: none;
        }

        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff5722;
            z-index: 10;
        }

        /* Toggle Switch */
        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
        }

        .toggle-label {
            font-weight: 500;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3a3a;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4caf50;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Utility */
        .text-green {
            color: #4caf50;
        }

        .mb-2 {
            margin-bottom: 8px;
        }

        .mb-3 {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="screens"></div>
    </div>

    <script>
        // ========== DATABASE ==========
        const FOODS = [
            { id: 1, name_uz: "Lagman", name_ru: "Лагман", price: 28000, category: "Osh", image: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=200&h=200&fit=crop", desc_uz: "Mazali uy lagmani", desc_ru: "Вкусный домашний лагман" },
            { id: 2, name_uz: "Palov", name_ru: "Плов", price: 32000, category: "Osh", image: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=300&h=300&fit=crop", desc_uz: "An'anaviy to'y palovi", desc_ru: "Традиционный плов" },
            { id: 3, name_uz: "Burger", name_ru: "Бургер", price: 25000, category: "Fast food", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200&h=200&fit=crop", desc_uz: "Double beef burger", desc_ru: "Двойной бургер" },
            { id: 4, name_uz: "Pizza", name_ru: "Пицца", price: 45000, category: "Fast food", image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=200&h=200&fit=crop", desc_uz: "Pepperoni pizza", desc_ru: "Пицца Пепперони" },
            { id: 5, name_uz: "Somsa", name_ru: "Самса", price: 8000, category: "Fast food",image: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300&h=300&fit=crop", desc_uz: "Tandir somsa", desc_ru: "Тандыр самса" },
            { id: 6, name_uz: "Moxito", name_ru: "Мохито", price: 12000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=200&h=200&fit=crop", desc_uz: "Yalpizli moxito", desc_ru: "Мохито с мятой" },
            { id: 7, name_uz: "Sharbat", name_ru: "Сок", price: 7000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=200&h=200&fit=crop", desc_uz: "Tabiiy meva sharbati", desc_ru: "Натуральный сок" }
        ];

        // ========== APP STATE ==========
        let currentUser = null;
        let currentLang = "uz";
        let cart = [];
        let orders = [];
        let cashbackBalance = 0;
        let useCashback = false;
        let currentCategory = "Barchasi";
        let currentScreen = "home";

        // ========== TRANSLATIONS ==========
        const t = (key) => {
            const dict = {
                uz: {
                    greeting: "Salom", balance: "Cashback", randomBtn: "🎡 Tasodifiy taom", categories: ["Barchasi", "Osh", "Fast food", "Ichimliklar"],
                    cartTitle: "Savat", total: "Jami", cashbackInfo: "Cashback (5%)", finalPrice: "Yakuniy", payment: "To'lovga o'tish",
                    paymentOptions: "To'lov usuli", confirmPay: "To'lovni tasdiqlash", successMsg: "To'lov muvaffaqiyatli!",
                    ordersTitle: "Buyurtmalar", profileTitle: "Profil", nameLabel: "Ism", phoneLabel: "Telefon", cashbackLabel: "Cashback balans",
                    language: "Til", support: "Yordam", contact: "Telegram orqali bog'lanish", useCashback: "Cashbackni ishlatish"
                },
                ru: {
                    greeting: "Здравствуйте", balance: "Кешбэк", randomBtn: "🎡 Случайное блюдо", categories: ["Все", "Плов", "Фастфуд", "Напитки"],
                    cartTitle: "Корзина", total: "Итого", cashbackInfo: "Кешбэк (5%)", finalPrice: "Итог", payment: "К оплате",
                    paymentOptions: "Способ оплаты", confirmPay: "Подтвердить", successMsg: "Оплата успешна!",
                    ordersTitle: "Заказы", profileTitle: "Профиль", nameLabel: "Имя", phoneLabel: "Телефон", cashbackLabel: "Кешбэк баланс",
                    language: "Язык", support: "Поддержка", contact: "Связаться через Telegram", useCashback: "Использовать кешбэк"
                }
            };
            return dict[currentLang][key] || key;
        };

        // ========== HELPERS ==========
        function validatePhone(phone) {
            const clean = phone.replace(/\s/g, '');
            return /^\+998[0-9]{9}$/.test(clean);
        }

        function saveData() {
            if (currentUser) {
                localStorage.setItem("campus_user", JSON.stringify({
                    name: currentUser.name,
                    phone: currentUser.phone,
                    cashback: cashbackBalance,
                    orders: orders,
                    lang: currentLang
                }));
            }
            localStorage.setItem("campus_cart", JSON.stringify(cart));
        }

        function loadData() {
            const userData = localStorage.getItem("campus_user");
            if (userData) {
                const data = JSON.parse(userData);
                currentUser = { name: data.name, phone: data.phone };
                cashbackBalance = data.cashback || 0;
                orders = data.orders || [];
                currentLang = data.lang || "uz";
            }
            const savedCart = localStorage.getItem("campus_cart");
            if (savedCart) cart = JSON.parse(savedCart);
        }

        function getTotalCart() {
            return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        }

        function getCashbackAmount() {
            return Math.floor(getTotalCart() * 0.05);
        }

        function getFinalTotal() {
            let total = getTotalCart();
            if (useCashback && cashbackBalance > 0) {
                total = Math.max(0, total - cashbackBalance);
            }
            return total;
        }

        function addToCart(food) {
            const existing = cart.find(i => i.id === food.id);
            if (existing) existing.quantity++;
            else cart.push({ ...food, quantity: 1 });
            saveData();
            renderCurrentScreen();
        }

        // ========== RENDER FUNCTIONS ==========
        function renderAuth() {
            return `
                <div class="auth-overlay" id="authOverlay">
                    <div class="card" style="max-width: 400px; width: 100%;">
                        <h2 style="text-align: center; margin-bottom: 24px;">🍽️ CampusEats</h2>
                        <div class="input-group">
                            <label class="input-label">${currentLang === 'uz' ? 'Ismingiz' : 'Ваше имя'}</label>
                            <input type="text" id="authName" placeholder="${currentLang === 'uz' ? 'Ism' : 'Имя'}">
                            <div class="error-message" id="nameError">${currentLang === 'uz' ? 'Ism majburiy' : 'Имя обязательно'}</div>
                        </div>
                        <div class="input-group">
                            <label class="input-label">${currentLang === 'uz' ? 'Telefon' : 'Телефон'}</label>
                            <input type="tel" id="authPhone" placeholder="+998 91 132 55 55">
                            <div class="error-message" id="phoneError">${currentLang === 'uz' ? "Noto'g'ri format. +998901234567" : 'Неверный формат. +998901234567'}</div>
                        </div>
                        <button class="btn-primary" id="loginBtn">${currentLang === 'uz' ? 'Kirish' : 'Войти'}</button>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            const greeting = `${t('greeting')}, ${currentUser.name}!`;
            const filtered = currentCategory === "Barchasi" ? FOODS : FOODS.filter(f => f.category === currentCategory);
            
            return `
                <div class="screen" id="homeScreen">
                    <div class="card">
                        <div id="greetingMsg" style="font-size: 24px; font-weight: 700; margin-bottom: 12px;">${greeting}</div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>💰 <span id="balanceVal">${cashbackBalance}</span> so'm</div>
                        </div>
                    </div>
                    
                    <div class="category-filter" id="categoryChips">
                        ${t('categories').map(cat => `<div class="chip ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>`).join('')}
                    </div>
                    
                    <div class="food-grid" id="foodList">
                        ${filtered.map(food => `
                            <div class="food-item">
                                <img class="food-img" src="${food.image}" loading="lazy">
                                <div class="food-info">
                                    <div class="food-name">${currentLang === 'uz' ? food.name_uz : food.name_ru}</div>
                                    <div class="food-price">${food.price.toLocaleString()} so'm</div>
                                </div>
                                <button class="add-btn" data-id="${food.id}">+</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCart() {
            const total = getTotalCart();
            const cashback = getCashbackAmount();
            const finalTotal = getFinalTotal();
            
            return `
                <div class="screen" id="cartScreen">
                    <h2 style="margin-bottom: 20px;">🛒 ${t('cartTitle')}</h2>
                    <div id="cartList">
                        ${cart.length === 0 ? '<div class="card">Savat bo\'sh</div>' : cart.map((item, idx) => `
                            <div class="card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>${currentLang === 'uz' ? item.name_uz : item.name_ru}</strong><br>
                                        ${item.price.toLocaleString()} so'm
                                    </div>
                                    <div style="display: flex; gap: 12px; align-items: center;">
                                        <button class="qty-btn" data-idx="${idx}" data-delta="-1" style="background: #2a2a2a; border: none; width: 36px; height: 36px; border-radius: 50%; color: white; font-size: 20px;">-</button>
                                        <span style="font-size: 18px; font-weight: 600;">${item.quantity}</span>
                                        <button class="qty-btn" data-idx="${idx}" data-delta="1" style="background: #2a2a2a; border: none; width: 36px; height: 36px; border-radius: 50%; color: white; font-size: 20px;">+</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    ${cart.length > 0 ? `
                        <div class="card">
                            <div class="toggle-switch">
                                <span class="toggle-label">${t('useCashback')}</span>
                                <label class="toggle">
                                    <input type="checkbox" id="useCashbackToggle" ${useCashback ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div style="margin-top: 16px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <span>${t('total')}:</span>
                                    <span>${total.toLocaleString()} so'm</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #4caf50;">
                                    <span>${t('cashbackInfo')}:</span>
                                    <span>+${cashback.toLocaleString()} so'm</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a2a; font-size: 18px; font-weight: 700;">
                                    <span>${t('finalPrice')}:</span>
                                    <span class="text-green">${finalTotal.toLocaleString()} so'm</span>
                                </div>
                            </div>
                            <button class="btn-primary" id="paymentBtn" style="margin-top: 20px;">${t('payment')}</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderOrders() {
            return `
                <div class="screen" id="ordersScreen">
                    <h2 style="margin-bottom: 20px;">📋 ${t('ordersTitle')}</h2>
                    ${orders.length === 0 ? '<div class="card">No orders yet</div>' : orders.map(order => `
                        <div class="card">
                            <div style="font-weight: 600; margin-bottom: 8px;">Order #${order.id}</div>
                            <div style="color: #aaa; font-size: 14px;">${order.date}</div>
                            <div style="margin-top: 8px;">Total: ${order.total.toLocaleString()} so'm</div>
                            <div style="margin-top: 4px; color: #4caf50;">Status: ${order.status}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="screen" id="profileScreen">
                    <div class="card">
                        <h3 style="margin-bottom: 16px;">👤 ${t('profileTitle')}</h3>
                        <div class="mb-2"><strong>${t('nameLabel')}:</strong> ${currentUser.name}</div>
                        <div class="mb-2"><strong>${t('phoneLabel')}:</strong> ${currentUser.phone}</div>
                        <div class="mb-3"><strong>💰 ${t('cashbackLabel')}:</strong> ${cashbackBalance.toLocaleString()} so'm</div>
                        <hr style="border-color: #2a2a2a; margin: 16px 0;">
                        <div class="input-group">
                            <label class="input-label">${t('language')}</label>
                            <select id="langSelect" style="background: #1e1e1e; padding: 12px; border-radius: 12px; color: white; width: 100%;">
                                <option value="uz" ${currentLang === 'uz' ? 'selected' : ''}>O'zbekcha</option>
                                <option value="ru" ${currentLang === 'ru' ? 'selected' : ''}>Русский</option>
                            </select>
                        </div>
                        <div style="margin-top: 16px;">
                            <div style="margin-bottom: 8px;"><strong>${t('support')}</strong></div>
                            <button class="btn-secondary" id="supportBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                📱 Telegram: @CampusEatsSupport
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPayment() {
            return `
                <div class="screen" id="paymentScreen">
                    <div class="card">
                        <h2 style="margin-bottom: 20px;">💳 ${t('paymentOptions')}</h2>
                        <div style="margin-bottom: 20px;">
                            <div style="padding: 12px; margin-bottom: 8px; background: #1a1a1a; border-radius: 12px;">Click</div>
                            <div style="padding: 12px; margin-bottom: 8px; background: #1a1a1a; border-radius: 12px;">Payme</div>
                            <div style="padding: 12px; margin-bottom: 8px; background: #1a1a1a; border-radius: 12px;">Uzcard</div>
                            <div style="padding: 12px; background: #1a1a1a; border-radius: 12px;">${currentLang === 'uz' ? 'Naqd' : 'Наличные'}</div>
                        </div>
                        <div style="font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px;">
                            ${getFinalTotal().toLocaleString()} so'm
                        </div>
                        <button class="btn-primary" id="confirmPaymentBtn">${t('confirmPay')}</button>
                    </div>
                </div>
            `;
        }

        function renderSuccess() {
            const earned = getCashbackAmount();
            return `
                <div class="screen" id="successScreen">
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 64px; margin-bottom: 16px;">✅</div>
                        <h2 style="margin-bottom: 12px;">${t('successMsg')}</h2>
                        <p class="text-green" style="font-size: 18px;">+${earned} cashback</p>
                        <button class="btn-primary" id="newOrderBtn" style="margin-top: 24px;">Yangi buyurtma</button>
                    </div>
                </div>
            `;
        }

        function showRoulette() {
            const foods = FOODS.slice(0, 6);
            let currentAngle = 0;
            let spinning = false;
            
            const modal = document.createElement('div');
            modal.className = 'roulette-modal';
            modal.innerHTML = `
                <div class="card" style="position: relative; width: 90%; max-width: 350px; text-align: center;">
                    <div class="wheel-wrapper">
                        <canvas id="wheelCanvas" width="300" height="300"></canvas>
                        <div class="pointer"></div>
                    </div>
                    <button class="btn-primary" id="spinWheelBtn" style="margin-top: 20px;">🎡 Aylantirish</button>
                    <button class="btn-secondary" id="closeRouletteBtn" style="margin-top: 12px;">Yopish</button>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            const canvas = modal.querySelector('#wheelCanvas');
            const ctx = canvas.getContext('2d');
            const size = 300;
            const angles = (Math.PI * 2) / foods.length;
            
            function drawWheel() {
                let start = currentAngle;
                for (let i = 0; i < foods.length; i++) {
                    const end = start + angles;
                    ctx.beginPath();
                    ctx.fillStyle = i % 2 === 0 ? '#1b3b1f' : '#2e7d32';
                    ctx.moveTo(size/2, size/2);
                    ctx.arc(size/2, size/2, size/2, start, end);
                    ctx.fill();
                    ctx.save();
                    ctx.translate(size/2, size/2);
                    ctx.rotate(start + angles/2);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px Inter';
                    ctx.fillText((currentLang === 'uz' ? foods[i].name_uz : foods[i].name_ru).slice(0, 8), 65, 8);
                    ctx.restore();
                    start = end;
                }
            }
            
            drawWheel();
            
            modal.querySelector('#spinWheelBtn').onclick = () => {
                if (spinning) return;
                spinning = true;
                const spins = 20 + Math.random() * 10;
                const finalIndex = Math.floor(Math.random() * foods.length);
                const targetAngle = (finalIndex * angles) + (angles/2);
                
                let startTime = null;
                const duration = 2000;
                
                function animateSpin(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const elapsed = timestamp - startTime;
                    const progress = Math.min(1, elapsed / duration);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = (currentAngle + spins * angles * easeOut) % (Math.PI * 2);
                    drawWheel();
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateSpin);
                    } else {
                        spinning = false;
                        const result = foods[finalIndex];
                        addToCart(result);
                        modal.remove();
                        renderCurrentScreen();
                    }
                }
                
                requestAnimationFrame(animateSpin);
            };
            
            modal.querySelector('#closeRouletteBtn').onclick = () => modal.remove();
        }

        function renderAllScreens() {

    const container = document.getElementById('screens');
    if (!container) return;

    // 🔴 AGAR USER YO‘Q BO‘LSA HECH NIMA CHIQMASIN
    if (!currentUser) {
        container.innerHTML = "";
        return;
    }

    // 🔴 HAMMA SCREENLARNI RENDER QILAMIZ
    container.innerHTML = `
        ${renderHome()}
        ${renderCart()}
        ${renderOrders()}
        ${renderProfile()}
        ${renderPayment()}
        ${renderSuccess()}

        <div class="bottom-nav">
            <button class="nav-item" data-nav="home">🏠 Bosh</button>
            <button class="nav-item" data-nav="cart">🛒 Savat</button>
            <button class="nav-item" data-nav="orders">📋 Buyurtma</button>
            <button class="nav-item" data-nav="profile">👤 Profil</button>
        </div>

        <button class="fab" id="rouletteFab">🎡</button>
    `;

    // 🔴 ACTIVE SCREENNI KO‘RSATAMIZ
    document.querySelectorAll('.screen').forEach(el => {
        el.classList.remove('active');
    });

    const activeScreen = document.getElementById(currentScreen + "Screen");
    if (activeScreen) {
        activeScreen.classList.add('active');
    } else {
        // fallback
        document.getElementById("homeScreen")?.classList.add("active");
    }

    // 🔴 NAVIGATION CLICK
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            currentScreen = btn.dataset.nav;
            renderAllScreens();
        };
    });

    // 🔴 CATEGORY FILTER
    document.querySelectorAll('.chip').forEach(chip => {
        chip.onclick = () => {
            currentCategory = chip.dataset.cat;
            renderAllScreens();
        };
    });

    // 🔴 ADD TO CART
    document.querySelectorAll('.add-btn').forEach(btn => {
        btn.onclick = () => {
            const food = FOODS.find(f => f.id === parseInt(btn.dataset.id));
            if (food) addToCart(food);
        };
    });

    // 🔴 CART +/- BUTTON
    document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.onclick = () => {
            const idx = parseInt(btn.dataset.idx);
            const delta = parseInt(btn.dataset.delta);

            if (cart[idx]) {
                cart[idx].quantity += delta;
                if (cart[idx].quantity <= 0) cart.splice(idx, 1);
                saveData();
                renderAllScreens();
            }
        };
    });

    // 🔴 CASHBACK SWITCH
    const toggle = document.getElementById('useCashbackToggle');
    if (toggle) {
        toggle.onchange = (e) => {
            useCashback = e.target.checked;
            renderAllScreens();
        };
    }

    // 🔴 PAYMENT
    const paymentBtn = document.getElementById('paymentBtn');
    if (paymentBtn) {
        paymentBtn.onclick = () => {
            currentScreen = 'payment';
            renderAllScreens();
        };
    }

    // 🔴 CONFIRM PAYMENT
    const confirmBtn = document.getElementById('confirmPaymentBtn');
    if (confirmBtn) {
        confirmBtn.onclick = () => {

            const earned = getCashbackAmount();
            cashbackBalance += earned;

            if (useCashback) {
                cashbackBalance = Math.max(0, cashbackBalance - getTotalCart());
            }

            const newOrder = {
                id: Date.now(),
                items: [...cart],
                total: getTotalCart(),
                date: new Date().toLocaleString(),
                status: "Qabul qilindi"
            };

            orders.unshift(newOrder);

            cart = [];
            useCashback = false;

            saveData();

            currentScreen = 'success';
            renderAllScreens();
        };
    }

    // 🔴 NEW ORDER
    const newOrderBtn = document.getElementById('newOrderBtn');
    if (newOrderBtn) {
        newOrderBtn.onclick = () => {
            currentScreen = 'home';
            renderAllScreens();
        };
    }

    // 🔴 LANGUAGE
    const langSelect = document.getElementById('langSelect');
    if (langSelect) {
        langSelect.onchange = (e) => {
            currentLang = e.target.value;
            saveData();
            renderAllScreens();
        };
    }

    // 🔴 SUPPORT
    const supportBtn = document.getElementById('supportBtn');
    if (supportBtn) {
        supportBtn.onclick = () => {
            window.open('https://t.me/CampusEatsSupport', '_blank');
        };
    }

    // 🔴 ROULETTE
    const fab = document.getElementById('rouletteFab');
    if (fab) {
        fab.onclick = showRoulette;
    }
}
        
        // ========== INIT ==========
        loadData();
        
        if (!currentUser) {
            document.body.insertAdjacentHTML('beforeend', renderAuth());
            document.getElementById('loginBtn').onclick = () => {
                const name = document.getElementById('authName').value.trim();
                const phone = document.getElementById('authPhone').value.trim();
                let valid = true;
                
                if (!name) {
                    document.getElementById('nameError').classList.add('show');
                    valid = false;
                } else {
                    document.getElementById('nameError').classList.remove('show');
                }
                
                if (!validatePhone(phone)) {
                    document.getElementById('phoneError').classList.add('show');
                    valid = false;
                } else {
                    document.getElementById('phoneError').classList.remove('show');
                }
                
                if (valid) {
                    currentUser = { name, phone };
                    cashbackBalance = 0;
                    cart = [];
                    orders = [];
                    saveData();
                    document.querySelector('.auth-overlay').remove();
                    renderAllScreens();
                }
            };
        } else {
            renderAllScreens();
        }
    </script>

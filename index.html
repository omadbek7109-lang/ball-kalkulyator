<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ball Kalkulyator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    .card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
    }
    
    .input-focus {
      transition: all 0.3s ease;
    }
    
    .input-focus:focus {
      border-color: #eab308;
      box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.2);
      transform: scale(1.02);
    }
    
    .btn-hover {
      position: relative;
      overflow: hidden;
    }
    
    .btn-hover::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 40%;
      height: 400%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.5),
        transparent
      );
      transform: skewX(-25deg);
      animation: shimmer 3s infinite;
    }
    
    @keyframes shimmer {
      100% { transform: translateX(400%); }
    }
    
    .progress-bar {
      transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-blue-950 to-slate-950 text-white min-h-screen">
  <div class="max-w-md mx-auto pt-12 px-4 pb-24">
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-lg px-6 py-3 rounded-3xl border border-white/10">
        <i class="fa-solid fa-calculator text-yellow-400 text-3xl"></i>
        <h1 class="text-4xl font-bold tracking-tight">Ball Kalkulyator</h1>
      </div>
      <p class="text-blue-300 mt-3 text-sm">Joriy • Oraliq • Yakuniy nazorat ballari</p>
    </div>

    <!-- Main Card -->
    <div class="card bg-slate-900/90 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl p-8">
      
      <!-- Input Fields -->
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-book"></i> Joriy Nazorat (JN)
          </label>
          <input type="number" id="jn" min="0" max="30" placeholder="0 - 30 ball" 
                 class="input-focus w-full bg-slate-800 border border-slate-600 rounded-2xl px-6 py-4 text-xl focus:outline-none text-white"/>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-400 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-layer-group"></i> Oraliq Nazorat (OR)
          </label>
          <input type="number" id="or" min="0" max="30" placeholder="0 - 30 ball"
                 class="input-focus w-full bg-slate-800 border border-slate-600 rounded-2xl px-6 py-4 text-xl focus:outline-none text-white"/>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-400 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-flag-checkered"></i> Yakuniy Nazorat (YN)
          </label>
          <input type="number" id="yn" min="0" max="40" placeholder="0 - 40 ball"
                 class="input-focus w-full bg-slate-800 border border-slate-600 rounded-2xl px-6 py-4 text-xl focus:outline-none text-white"/>
        </div>
      </div>

      <!-- Calculate Button -->
      <button onclick="hisobla()" 
              class="btn-hover mt-10 w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-slate-950 font-bold text-xl py-6 rounded-3xl flex items-center justify-center gap-3 transition-all active:scale-95">
        <i class="fa-solid fa-calculator"></i>
        <span>HISOBLASH</span>
      </button>

      <!-- Result Section -->
      <div id="result" class="hidden mt-10 pt-8 border-t border-slate-700">
        <div class="text-center mb-8">
          <div id="totalScore" class="text-8xl font-bold text-white mb-2">85</div>
          <div class="text-slate-400 text-lg">Jami ball</div>
        </div>

        <!-- Progress Bar -->
        <div class="mb-8">
          <div class="flex justify-between text-xs text-slate-400 mb-2">
            <span>0</span>
            <span>100</span>
          </div>
          <div class="h-4 bg-slate-800 rounded-3xl overflow-hidden">
            <div id="progress" class="progress-bar h-full bg-gradient-to-r from-yellow-400 to-green-500 rounded-3xl" style="width: 0%"></div>
          </div>
        </div>

        <!-- Status -->
        <div id="status" class="text-center py-6 px-8 rounded-3xl text-2xl font-semibold mb-6">
          <!-- Dynamic content -->
        </div>

        <!-- Needed Points -->
        <div id="needed" class="text-center text-lg text-slate-300"></div>
      </div>

      <!-- Clear Button -->
      <button onclick="tozalash()" 
              class="mt-6 w-full text-slate-400 hover:text-white transition-colors text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-trash"></i>
        <span>Tozalash</span>
      </button>
    </div>

    <!-- Footer Info -->
    <div class="text-center mt-12 text-xs text-slate-500">
      Talabalar uchun • Minimal talab: <span class="text-yellow-400 font-medium">60 ball</span>
    </div>
  </div>

  <script>
    function hisobla() {
      const jn = parseFloat(document.getElementById('jn').value) || 0;
      const or = parseFloat(document.getElementById('or').value) || 0;
      const yn = parseFloat(document.getElementById('yn').value) || 0;

      // Validation
      if (jn > 30 || or > 30 || yn > 40) {
        alert("Ball chegarasini to'g'ri kiriting!\nJN va OR: 30 ballgacha\nYN: 40 ballgacha");
        return;
      }

      const total = jn + or + yn;
      const resultDiv = document.getElementById('result');
      
      // Show result section
      resultDiv.classList.remove('hidden');
      resultDiv.scrollIntoView({ behavior: 'smooth' });

      // Update total score
      document.getElementById('totalScore').textContent = total;

      // Progress bar
      const progressPercent = Math.min((total / 100) * 100, 100);
      const progressBar = document.getElementById('progress');
      progressBar.style.width = `${progressPercent}%`;

      // Status and color
      const statusDiv = document.getElementById('status');
      const neededDiv = document.getElementById('needed');

      if (total >= 60) {
        statusDiv.innerHTML = `Siz o'tdingiz ✅`;
        statusDiv.className = `text-center py-6 px-8 rounded-3xl text-2xl font-semibold mb-6 bg-green-500/20 text-green-400 border border-green-500/30`;
        neededDiv.innerHTML = `<span class="text-green-400">Ajoyib natija!</span>`;
      } else {
        const needed = 60 - total;
        statusDiv.innerHTML = `Yana o'tolmadingiz ❌`;
        statusDiv.className = `text-center py-6 px-8 rounded-3xl text-2xl font-semibold mb-6 bg-red-500/20 text-red-400 border border-red-500/30`;
        neededDiv.innerHTML = `<span class="text-orange-400">${needed} ball</span> yetishmayapti`;
      }
    }

    function tozalash() {
      document.getElementById('jn').value = '';
      document.getElementById('or').value = '';
      document.getElementById('yn').value = '';
      
      const resultDiv = document.getElementById('result');
      resultDiv.classList.add('hidden');
    }

    // Keyboard support: Press Enter to calculate
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        hisobla();
      }
    });

    // Auto-save inputs to localStorage
    function saveToLocalStorage() {
      const jn = document.getElementById('jn').value;
      const or = document.getElementById('or').value;
      const yn = document.getElementById('yn').value;
      
      localStorage.setItem('ballCalc_jn', jn);
      localStorage.setItem('ballCalc_or', or);
      localStorage.setItem('ballCalc_yn', yn);
    }

    // Load saved data
    function loadFromLocalStorage() {
      const jn = localStorage.getItem('ballCalc_jn');
      const or = localStorage.getItem('ballCalc_or');
      const yn = localStorage.getItem('ballCalc_yn');
      
      if (jn) document.getElementById('jn').value = jn;
      if (or) document.getElementById('or').value = or;
      if (yn) document.getElementById('yn').value = yn;
    }

    // Event listeners for auto-save
    window.onload = function() {
      loadFromLocalStorage();
      
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('input', saveToLocalStorage);
      });
    };
  </script>
</body>
</html>

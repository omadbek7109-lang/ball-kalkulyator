<!DOCTYPE html>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
        .correct-flash {
            background-color: #22c55e !important;
        }
        .wrong-flash {
            background-color: #ef4444 !important;
        }
        .option-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .tab-active {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .tab-inactive {
            background-color: #e2e8f0;
            color: #1e293b;
        }
    </style>
</head>

    <div class="max-w-2xl mx-auto">

        </div>

        <!-- Bo'lim Tabs -->
        <div class="flex flex-wrap gap-2 mb-4 justify-center">
            <button data-section="0" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-active">1-bo‘lim (1-20)</button>
            <button data-section="1" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-inactive">2-bo‘lim (21-40)</button>

        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4 text-white">
                <div class="flex justify-between items-center">
                    <span class="font-semibold">📋 <span id="section-name">1-bo‘lim</span> — <span id="current-num">1</span> / <span id="total-num">0</span></span>
                    <span id="score-badge" class="bg-white/20 px-3 py-1 rounded-full text-sm">⭐ 0 to'g'ri</span>

                    <div id="progress-bar" class="bg-yellow-300 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>

            </div>

            </div>

            <div id="feedback" class="px-5 pb-2 text-center text-sm font-medium hidden"></div>

            <div class="px-5 pb-5 flex gap-3">

            { text: "Vazirlar Mahkamasi qaysi hokimiyat tarmog'i?", options: ["Qonun chiqaruvchi", "Ijro etuvchi", "Sud", "Qonun va ijro"], correct: "Ijro etuvchi" },
            { text: "2021-yil qanday nom bilan atalgan?", options: ["Yoshlarni qo'llab-quvvatlash yili", "Faol tadbirkorlik yili", "Ilm-ma'rifat va raqamli iqtisodiyot yili", "Pandemiya yili"], correct: "Yoshlarni qo'llab-quvvatlash yili" },
            { text: "Prezident so'zining ma'nosi?", options: ["Oldinda o'tiruvchi", "Gapirmoq", "So'zlamoq", "To'g'ri javob yo'q"], correct: "Oldinda o'tiruvchi" },
            { text: "Parlament so'zining ma'nosi?", options: ["Gapirmoq", "Oldinda o'tiruvchi", "So'zlamoq", "To'g'ri javob yo'q"], correct: "Gapirmoq" },
            { text: "O'zbekistonda necha millat yashaydi?", options: ["130 dan ortiq", "120 ga yaqin", "100 ga yaqin", "50 ga yaqin"], correct: "130 dan ortiq" },
            { text: "Huquqiy davlat belgilari?", options: ["Qonun ustuvorligi", "Demokratik saylov", "Hokimiyat bo'linishi", "Barcha javoblar to'g'ri"], correct: "Barcha javoblar to'g'ri" },
            { text: "Xususiylashtirish nima?", options: ["Mulkni davlat tasarrufidan chiqarish", "Iqtisodiy formatsiya", "Mahsulotni o'zi sotish", "Talab va taklif"], correct: "Mulkni davlat tasarrufidan chiqarish" },
            { text: "UzDeuAvto qachon ochilgan?", options: ["1996-yil 19-iyul", "1992-yil 8-dekabr", "2008-yil 20-mart", "2008-yil 19-aprel"], correct: "1996-yil 19-iyul" },
            { text: "2008-yil qanday nomlangan?", options: ["Yoshlar yili", "Obod mahalla yili", "Qariyalarni qadrlash yili", "Onalar va bolalar yili"], correct: "Yoshlar yili" },
            { text: "Mirzo Ulug'bek 600 yilligi qachon?", options: ["1992", "1993", "1991", "1994"], correct: "1994" },
            { text: "2020-yil qanday nomlangan?", options: ["Ilm, ma'rifat va raqamli iqtisodiyot yili", "Yoshlarni qo'llab-quvvatlash yili", "Faol investitsiyalar yili", "Faol tadbirkorlik yili"], correct: "Ilm, ma'rifat va raqamli iqtisodiyot yili" },
            { text: "Korrupsiya ta'rifi?", options: ["Qonunga zid faoliyat", "Mansabdan shaxsiy manfaat uchun foydalanish", "Ijtimoiy hodisa", "Siyosiy hodisa"], correct: "Mansabdan shaxsiy manfaat uchun foydalanish" },
            { text: "Referendumda kim qatnashadi?", options: ["21 yoshdan", "18 yoshdan", "Fuqarolik hashorati", "Barcha javoblar"], correct: "18 yoshdan" },
            { text: "Vatan so'zi qaysi tildan olingan?", options: ["Forscha", "Hindcha", "Turkcha", "Arabcha"], correct: "Arabcha" },
            { text: "Renessans ma'nosi?", options: ["Qayta tug'ilish", "Uyg'onish", "Yangilanish", "Barcha javoblar to'g'ri"], correct: "Barcha javoblar to'g'ri" },
            { text: "Yangi Konstitutsiya referendumi qachon bo'lgan?", options: ["2023-yil 30-aprel", "2023-yil 30-dekabr", "2022-yil 30-aprel", "2022-yil 30-dekabr"], correct: "2023-yil 30-aprel" },
            { text: "Siyosiy-ma'muriy bo'linish?", options: ["Qoraqalpog'iston + 14 viloyat", "Qoraqalpog'iston + 13 viloyat", "Qoraqalpog'iston + 12 viloyat + Toshkent", "Qoraqalpog'iston + 11 viloyat"], correct: "Qoraqalpog'iston + 12 viloyat + Toshkent" },
            { text: "O'zbekistonda qaysi yil hisobi?", options: ["Milodiy", "Hijriy", "Qamariy", "Shamsiy"], correct: "Milodiy" },
            { text: "Tarix so'zining ma'nosi?", options: ["Odam haqidagi fan", "O'tmish haqidagi fan", "O'simlik haqidagi fan", "Bitiklar haqidagi fan"], correct: "O'tmish haqidagi fan" }
        ];

        const allSections = [section0, section1, section2, section3, section4];
        const sectionNames = ["1-bo‘lim (1-20)", "2-bo‘lim (21-40)", "3-bo‘lim (41-60)", "4-bo‘lim (61-80)", "5-bo‘lim (81-102)"];

        let currentSection = 0;
        let shuffledQuestions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let isLocked = false;
        let totalQuestions = 0;

        // DOM elements
        const questionArea = document.getElementById('question-area');
        const currentNumSpan = document.getElementById('current-num');
        const totalNumSpan = document.getElementById('total-num');
        const scoreBadge = document.getElementById('score-badge');
        const progressBar = document.getElementById('progress-bar');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackDiv = document.getElementById('feedback');
        const resultModal = document.getElementById('result-modal');
        const finalScoreSpan = document.getElementById('final-score');
        const finalTotalSpan = document.getElementById('final-total');
        const finalBar = document.getElementById('final-bar');
        const congratsSpan = document.getElementById('congrats');
        const modalRestart = document.getElementById('modal-restart');
        const sectionNameSpan = document.getElementById('section-name');

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffleOptions(question) {
            return shuffleArray([...question.options]);
        }

        function loadSection(sectionIdx) {
            currentSection = sectionIdx;
            const sectionData = allSections[currentSection];
            shuffledQuestions = shuffleArray([...sectionData]);
            totalQuestions = shuffledQuestions.length;
            userAnswers = new Array(totalQuestions).fill(null);
            currentIndex = 0;
            isLocked = false;
            feedbackDiv.classList.add('hidden');
            sectionNameSpan.innerText = sectionNames[currentSection];
            renderQuestion();
            updateStats();
        }

        function updateStats() {
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                if (ans === null) return acc;
                return acc + (ans === shuffledQuestions[idx].correct ? 1 : 0);
            }, 0);
            scoreBadge.innerHTML = `⭐ ${correctCount} to'g'ri`;
            const answered = userAnswers.filter(a => a !== null).length;
            const percent = (answered / totalQuestions) * 100;
            progressBar.style.width = `${percent}%`;
        }

        function renderQuestion() {
            if (currentIndex >= totalQuestions) {
                showResults();
                return;
            }
            const q = shuffledQuestions[currentIndex];
            const shuffledOpts = shuffleOptions(q);
            
            let html = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-indigo-500 font-semibold bg-indigo-100 px-3 py-1 rounded-full">Savol ${currentIndex+1}/${totalQuestions}</span>
                    </div>
                    <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-5 leading-relaxed">${escapeHtml(q.text)}</h2>
                    <div class="space-y-3">
            `;
            
            const letters = ['A', 'B', 'C', 'D'];
            shuffledOpts.forEach((opt, idx) => {
                const isSelected = (userAnswers[currentIndex] === opt);
                html += `
                    <button class="option-btn w-full text-left p-3 rounded-xl border-2 ${isSelected ? 'bg-indigo-100 border-indigo-500' : 'bg-gray-50 border-gray-200 hover:border-indigo-300'} flex items-start gap-3" data-value="${escapeHtml(opt)}">
                        <span class="font-bold text-indigo-600 min-w-[30px]">${letters[idx]}.</span>
                        <span class="flex-1">${escapeHtml(opt)}</span>
                    </button>
                `;
            });
            
            html += `</div></div>`;
            questionArea.innerHTML = html;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isLocked) return;
                    const selected = btn.getAttribute('data-value');
                    handleAnswer(selected, btn);
                });
            });
            
            totalNumSpan.innerText = totalQuestions;
            currentNumSpan.innerText = currentIndex + 1;
        }
        
        function handleAnswer(selected, btnElement) {
            const currentQ = shuffledQuestions[currentIndex];
            const isCorrect = (selected === currentQ.correct);
            
            userAnswers[currentIndex] = selected;
            updateStats();
            
            isLocked = true;
            
            if (isCorrect) {
                btnElement.classList.add('correct-flash');
                showFeedback("✅ To‘g‘ri javob!", "text-green-600");
                setTimeout(() => {
                    btnElement.classList.remove('correct-flash');
                    moveToNext();
                }, 800);
            } else {
                btnElement.classList.add('wrong-flash');
                showFeedback(`❌ Noto‘g‘ri! To‘g‘ri javob: ${currentQ.correct}`, "text-red-600");
                setTimeout(() => {
                    btnElement.classList.remove('wrong-flash');
                    moveToNext();
                }, 3000);
            }
        }
        
        function moveToNext() {
            if (currentIndex + 1 < totalQuestions) {
                currentIndex++;
                renderQuestion();
                isLocked = false;
                feedbackDiv.classList.add('hidden');
            } else if (currentIndex + 1 === totalQuestions) {
                currentIndex++;
                isLocked = false;
                feedbackDiv.classList.add('hidden');
                showResults();
            } else {
                isLocked = false;
            }
        }
        
        function showFeedback(msg, colorClass) {
            feedbackDiv.innerHTML = `<span class="${colorClass} font-medium">${msg}</span>`;
            feedbackDiv.classList.remove('hidden');
        }
        
        function showResults() {
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                if (ans === null) return acc;
                return acc + (ans === shuffledQuestions[idx].correct ? 1 : 0);
            }, 0);
            const percent = Math.round((correctCount / totalQuestions) * 100);
            finalScoreSpan.innerText = correctCount;
            finalTotalSpan.innerText = totalQuestions;
            finalBar.style.width = `${percent}%`;
            
            if (percent >= 80) congratsSpan.innerHTML = "🎉 Ajoyib! Siz mavzuni mukammal bilasiz!";
            else if (percent >= 60) congratsSpan.innerHTML = "👍 Yaxshi! Yana bir marta takrorlang.";
            else congratsSpan.innerHTML = "📚 Materiallarni qayta o‘rganib, testni takrorlang.";
            
            resultModal.classList.remove('hidden');
        }
        
        function restartCurrentSection() {
            resultModal.classList.add('hidden');
            loadSection(currentSection);
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Tab switching
        document.querySelectorAll('.section-tab').forEach((tab, idx) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.section-tab').forEach(t => {
                    t.classList.remove('tab-active');
                    t.classList.add('tab-inactive');
                });
                tab.classList.remove('tab-inactive');
                tab.classList.add('tab-active');
                loadSection(idx);
            });
        });
        
        restartBtn.addEventListener('click', restartCurrentSection);
        modalRestart.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            loadSection(currentSection);
        });
        
        // Start with first section
        loadSection(0);
    </script>
</body>
</html>

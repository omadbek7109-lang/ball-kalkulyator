<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hemis Ball Kalkulyator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    .title-font {
      font-family: 'Poppins', sans-serif;
    }

    .card {
      transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .card:hover {
      transform: translateY(-10px);
    }

    .input-focus:focus {
      border-color: #eab308;
      box-shadow: 0 0 0 5px rgba(234, 179, 8, 0.3);
    }

    .gradient-btn {
      background: linear-gradient(90deg, #facc15, #f97316);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 to-blue-950 min-h-screen text-white overflow-hidden">
  <div class="max-w-5xl mx-auto px-6 py-8">
    
    <!-- Top Navigation -->
    <div class="flex justify-between items-center mb-10">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-3xl shadow-lg">🎓</div>
        <div>
          <h1 class="title-font text-3xl font-bold tracking-tight">HEMIS BALL</h1>
          <p class="text-yellow-300 text-sm -mt-1">KALKULYATOR</p>
        </div>
      </div>
      <div class="flex gap-4">
        <button onclick="showLogin()" 
                class="px-8 py-3 bg-white/10 hover:bg-white/20 backdrop-blur rounded-2xl font-medium transition-all">Kirish</button>
        <button onclick="showRegister()" 
                class="px-8 py-3 bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-950 font-semibold rounded-2xl hover:scale-105 transition-all">Ro'yxatdan o'tish</button>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-12 items-start">
      
      <!-- Left Side - Input Form -->
      <div class="card bg-white/10 backdrop-blur-xl border border-white/10 rounded-3xl p-10">
        <h2 class="text-4xl title-font font-bold mb-2">Ballaringizni hisoblang</h2>
        <p class="text-blue-200 mb-10">O'z baholaringizni osongina hisoblang</p>

        <!-- Mode Switch -->
        <div class="flex bg-white/10 rounded-3xl p-1 mb-8 w-fit">
          <button onclick="switchMode(0)" id="mode0" 
                  class="px-6 py-3 rounded-3xl font-medium transition-all active-mode">Ballarda</button>
          <button onclick="switchMode(1)" id="mode1" 
                  class="px-6 py-3 rounded-3xl font-medium transition-all">Foizda (%)</button>
        </div>

        <div class="space-y-8">
          <!-- Joriy Nazorat -->
          <div>
            <label class="flex items-center gap-3 text-lg font-medium mb-3">
              <i class="fa-solid fa-clipboard-check text-yellow-400"></i>
              Joriy Nazorat (JN - 40 ball)
            </label>
            <input type="number" id="jn" placeholder="Ball yoki % kiriting" step="0.01"
                   class="input-focus w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 text-2xl focus:outline-none"/>
          </div>

          <!-- Oraliq Nazorat -->
          <div>
            <label class="flex items-center gap-3 text-lg font-medium mb-3">
              <i class="fa-solid fa-layer-group text-yellow-400"></i>
              Oraliq Nazorat (OR - 20 ball)
            </label>
            <input type="number" id="or" placeholder="Ball yoki % kiriting" step="0.01"
                   class="input-focus w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 text-2xl focus:outline-none"/>
          </div>

          <!-- Yakuniy Nazorat -->
          <div>
            <label class="flex items-center gap-3 text-lg font-medium mb-3">
              <i class="fa-solid fa-flag-checkered text-yellow-400"></i>
              Yakuniy Nazorat (YN - 40 ball)
            </label>
            <input type="number" id="yn" placeholder="Ball yoki % kiriting (ixtiyoriy)" step="0.01"
                   class="input-focus w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 text-2xl focus:outline-none"/>
          </div>
        </div>

        <button onclick="hisobla()" 
                class="mt-12 w-full gradient-btn text-slate-950 font-bold text-2xl py-7 rounded-3xl hover:scale-105 transition-all flex items-center justify-center gap-3 shadow-xl">
          <i class="fa-solid fa-calculator"></i>
          <span>HISOBLASH</span>
        </button>
      </div>

      <!-- Right Side - Result + Illustration -->
      <div id="resultPanel" class="hidden card bg-white/10 backdrop-blur-xl border border-white/10 rounded-3xl p-10 h-full">
        <div class="text-center">
          <h3 class="text-2xl font-medium text-blue-200 mb-2">Sizning jami balingiz</h3>
          <div id="totalScore" class="text-8xl font-bold text-white mb-1">0</div>
          <div class="text-3xl text-yellow-400 font-medium">BALL</div>
        </div>

        <div class="my-10">
          <div class="h-3 bg-white/10 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-yellow-400 to-green-400 rounded-full transition-all duration-1000" style="width: 0%"></div>
          </div>
        </div>

        <div id="statusMessage" class="text-2xl font-semibold text-center py-6 px-8 rounded-3xl mb-8"></div>

        <div class="grid grid-cols-3 gap-4 text-center">
          <div class="bg-white/5 rounded-2xl p-4">
            <div class="text-xs text-slate-400">JN</div>
            <div id="jnResult" class="text-2xl font-bold">0</div>
          </div>
          <div class="bg-white/5 rounded-2xl p-4">
            <div class="text-xs text-slate-400">OR</div>
            <div id="orResult" class="text-2xl font-bold">0</div>
          </div>
          <div class="bg-white/5 rounded-2xl p-4">
            <div class="text-xs text-slate-400">YN</div>
            <div id="ynResult" class="text-2xl font-bold">0</div>
          </div>
        </div>

        <div id="finalMessage" class="mt-10 text-center text-lg"></div>
      </div>
    </div>

    <!-- Bottom Info -->
    <div class="mt-16 text-center text-sm text-blue-300">
      Joriy + Oraliq = 60 ball • Yakuniy imtihon uchun minimal talab: <span class="text-yellow-400 font-medium">36 ball</span>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur flex items-center justify-center z-50">
    <div class="bg-slate-900 border border-white/10 rounded-3xl max-w-md w-full mx-4 overflow-hidden">
      <div class="p-10">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-3xl font-bold text-yellow-400">Talaba Ro'yxati</h2>
          <button onclick="hideRegister()" class="text-3xl text-slate-400 hover:text-white">×</button>
        </div>
        
        <div class="space-y-6">
          <input type="text" id="fullName" placeholder="Ism va Familiya" 
                 class="w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 focus:outline-none focus:border-yellow-400"/>
          <input type="text" id="university" placeholder="OTM (Universitet)" 
                 class="w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 focus:outline-none focus:border-yellow-400"/>
          <input type="password" id="password" placeholder="Parol" 
                 class="w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 focus:outline-none focus:border-yellow-400"/>
          <input type="password" id="confirmPassword" placeholder="Parolni tasdiqlash" 
                 class="w-full bg-white/10 border border-white/30 rounded-2xl px-6 py-5 focus:outline-none focus:border-yellow-400"/>
        </div>

        <button onclick="registerUser()" 
                class="mt-10 w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-950 font-bold py-6 rounded-3xl text-xl hover:scale-105 transition-all">
          Ro'yxatdan o'tish
        </button>

        <p class="text-center mt-6 text-sm text-slate-400">
          Allaqachon hisobingiz bormi? 
          <span onclick="hideRegister(); showLogin()" class="text-yellow-400 cursor-pointer hover:underline">Kirish</span>
        </p>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 0; // 0 = ball, 1 = percent

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('mode0').classList.toggle('bg-white/20', mode === 0);
      document.getElementById('mode1').classList.toggle('bg-white/20', mode === 1);
    }

    function convertPercentToBall(value, maxBall) {
      if (currentMode === 0) return Math.min(Math.max(parseFloat(value) || 0, 0), maxBall);
      return Math.min(Math.max((parseFloat(value) || 0) / 100 * maxBall, 0), maxBall);
    }

    function hisobla() {
      let jnInput = document.getElementById('jn').value;
      let orInput = document.getElementById('or').value;
      let ynInput = document.getElementById('yn').value || 0;

      const jn = convertPercentToBall(jnInput, 40);
      const or = convertPercentToBall(orInput, 20);
      const yn = convertPercentToBall(ynInput, 40);

      const total = jn + or + yn;
      const jnOrTotal = jn + or;

      // Show result panel
      document.getElementById('resultPanel').classList.remove('hidden');

      // Update scores
      document.getElementById('totalScore').textContent = total.toFixed(1);
      document.getElementById('jnResult').textContent = jn.toFixed(1);
      document.getElementById('orResult').textContent = or.toFixed(1);
      document.getElementById('ynResult').textContent = yn.toFixed(1);

      // Progress bar (based on JN + OR for final exam access)
      const progress = Math.min((jnOrTotal / 60) * 100, 100);
      document.getElementById('progressBar').style.width = `${progress}%`;

      // Status
      const statusEl = document.getElementById('statusMessage');
      const finalMsg = document.getElementById('finalMessage');

      if (jnOrTotal >= 36) {
        statusEl.innerHTML = `Siz muvaffaqiyatli Yakuniy nazorat imtihonini topshira olasiz ✅`;
        statusEl.className = `text-2xl font-semibold text-center py-6 px-8 rounded-3xl mb-8 bg-green-500/20 text-green-400 border border-green-500/30`;
        finalMsg.innerHTML = `<span class="text-green-400">Imtihonda omad tilayman!</span>`;
      } else {
        const needed = (36 - jnOrTotal).toFixed(1);
        statusEl.innerHTML = `Afsuski, ballingiz Yakuniy Nazorat topshirish uchun yetmayapti ❌`;
        statusEl.className = `text-2xl font-semibold text-center py-6 px-8 rounded-3xl mb-8 bg-red-500/20 text-red-400 border border-red-500/30`;
        finalMsg.innerHTML = `<span class="text-orange-400">${needed} ball</span> yetishmayapti`;
      }
    }

    // Modal functions
    function showRegister() {
      document.getElementById('registerModal').classList.remove('hidden');
    }

    function hideRegister() {
      document.getElementById('registerModal').classList.add('hidden');
    }

    function registerUser() {
      const name = document.getElementById('fullName').value.trim();
      if (!name) {
        alert("Ism va familiyangizni kiriting!");
        return;
      }
      alert(`Tabriklaymiz, ${name}!\nSiz muvaffaqiyatli ro'yxatdan o'tdingiz.\nEndi ballaringizni hisoblang!`);
      hideRegister();
    }

    function showLogin() {
      alert("Kirish oynasi (demo versiya)\nReal loyihada backend bilan bog'lanadi.");
    }

    // Keyboard support
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') hisobla();
    });

    // Tailwind script already loaded via CDN
  </script>
</body>
</html>

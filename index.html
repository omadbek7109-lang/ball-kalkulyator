<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Prandium Campus | Kokand University</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #f8f9fc;
            color: #1c1e24;
            padding-bottom: 80px;
        }

        /* smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* container */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: #f8f9fc;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.02);
        }

        /* header */
        .header {
            padding: 24px 20px 12px;
            background: linear-gradient(135deg, #fff, #fef7e8);
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #DA7B2C, #F5A65B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 14px;
            color: #6c6f78;
            margin-top: 4px;
        }

        /* bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px 26px;
            border-top: 0.5px solid rgba(0,0,0,0.05);
            box-shadow: 0 -2px 20px rgba(0,0,0,0.03);
            z-index: 100;
        }

        .nav-btn {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #8e919b;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
        }

        .nav-btn i { font-size: 22px; font-style: normal; font-weight: 500; }
        .nav-btn.active {
            color: #DA7B2C;
            background: #fff2e6;
        }

        /* pages */
        .page {
            display: none;
            padding: 16px 18px 30px;
            animation: fade 0.25s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* food cards */
        .food-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .food-card {
            background: white;
            border-radius: 28px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.03), 0 2px 4px rgba(0,0,0,0.02);
            transition: transform 0.1s ease;
            border: 0.5px solid rgba(0,0,0,0.03);
        }

        .food-img {
            width: 70px;
            height: 70px;
            background: #fef3e8;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .food-info {
            flex: 1;
        }

        .food-name {
            font-weight: 600;
            font-size: 17px;
        }

        .food-price {
            color: #DA7B2C;
            font-weight: 600;
            margin-top: 4px;
            font-size: 15px;
        }

        .add-btn, .remove-item, .pay-btn {
            background: #DA7B2C;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(218,123,44,0.2);
        }

        .add-btn:active, .pay-btn:active { transform: scale(0.96); background: #c26a1f;}

        /* cart styles */
        .cart-item {
            background: white;
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-summary {
            background: white;
            border-radius: 28px;
            padding: 18px;
            margin-top: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.03);
        }

        .pay-options {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }

        .pay-btn { flex: 1; text-align: center; background: #2c3e66; box-shadow: none; }
        .payme { background: #005C9E; }
        .click { background: #00A651; }

        /* admin toggle switch */
        .admin-toggle {
            background: #f0f2f6;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #ccc;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-switch.active {
            background: #DA7B2C;
        }

        .toggle-switch:after {
            content: "";
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 20px;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.2s;
        }

        .toggle-switch.active:after {
            left: 21px;
        }

        /* admin panel */
        .admin-panel {
            background: #ffffffd9;
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 18px;
            margin-top: 20px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .admin-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #f9f6f0;
            flex: 1;
            padding: 12px;
            border-radius: 24px;
            text-align: center;
        }

        .order-list-admin {
            max-height: 260px;
            overflow-y: auto;
        }

        .badge {
            background: #ffeee2;
            color: #DA7B2C;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        button.status-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 11px;
            margin-left: 6px;
        }

        .bonus-badge {
            background: linear-gradient(145deg, #fff1e2, #ffe6d4);
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }

        hr {
            margin: 16px 0;
            opacity: 0.2;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🍽️ Prandium</h1>
        <p>Kokand University • Andijan Branch</p>
        <div id="userGreet" style="font-weight: 500; margin-top: 8px;">👤 </div>
        <div class="bonus-badge" id="bonusDisplay" style="margin-top: 10px;">🎁 Bonus: 0 UZS</div>
    </div>

    <!-- bottom navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" data-nav="home">🏠 Home</button>
        <button class="nav-btn" data-nav="cart">🛒 Cart</button>
        <button class="nav-btn" data-nav="profile">👤 Profile</button>
    </div>

    <!-- HOME PAGE -->
    <div id="homePage" class="page active">
        <div class="food-grid" id="menuContainer"></div>
        <div class="admin-toggle" id="adminToggleZone">
            <span>⚙️ Admin mode</span>
            <div id="toggleAdminBtn" class="toggle-switch"></div>
        </div>
        <div id="adminPanelArea" style="display: none;"></div>
    </div>

    <!-- CART PAGE -->
    <div id="cartPage" class="page">
        <div id="cartItemsList"></div>
        <div class="cart-summary">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <span>💰 Jami summa:</span>
                <strong id="totalPrice">0 UZS</strong>
            </div>
            <div class="pay-options">
                <button class="pay-btn click" id="payClickBtn">💳 Click</button>
                <button class="pay-btn payme" id="payPaymeBtn">📱 Payme</button>
            </div>
            <button id="confirmPaidBtn" style="margin-top: 16px; width: 100%; background:#2c3e66;">✅ I have paid</button>
        </div>
    </div>

    <!-- PROFILE PAGE -->
    <div id="profilePage" class="page">
        <div style="background: white; border-radius: 32px; padding: 20px;">
            <h3 style="margin-bottom: 12px;">👤 User info</h3>
            <p><strong>Name:</strong> <span id="profileName"></span></p>
            <p><strong>User ID:</strong> <span id="profileUserId"></span></p>
            <p><strong>Total orders:</strong> <span id="userTotalOrders">0</span></p>
            <hr>
            <h4>📋 My orders</h4>
            <div id="userOrdersList"></div>
        </div>
    </div>
</div>

<script>
    // ---------- DATA MODELS (localStorage) ----------
    let menu = [
        { id: 1, name: "Plov", price: 25000, image: "🍛", available: true },
        { id: 2, name: "Somsa", price: 7000, image: "🥟", available: true },
        { id: 3, name: "Tea", price: 3000, image: "🍵", available: true },
        { id: 4, name: "Salad", price: 12000, image: "🥗", available: true }
    ];

    let orders = [];          // { id, userId, userName, items, total, status, timestamp, orderCode }
    let users = [];          // { id, name, createdAt, bonus }
    let cart = [];

    let currentUser = null;
    let adminMode = false;
    let nextOrderId = 101;

    // helper: save all to LS
    function saveAllData() {
        localStorage.setItem("prandium_menu", JSON.stringify(menu));
        localStorage.setItem("prandium_orders", JSON.stringify(orders));
        localStorage.setItem("prandium_users", JSON.stringify(users));
        localStorage.setItem("prandium_cart", JSON.stringify(cart));
        localStorage.setItem("prandium_nextOrderId", nextOrderId);
        if(currentUser) localStorage.setItem("prandium_currentUser", JSON.stringify(currentUser));
    }

    function loadAllData() {
        let savedMenu = localStorage.getItem("prandium_menu");
        if(savedMenu) menu = JSON.parse(savedMenu);
        let savedOrders = localStorage.getItem("prandium_orders");
        if(savedOrders) orders = JSON.parse(savedOrders);
        let savedUsers = localStorage.getItem("prandium_users");
        if(savedUsers) users = JSON.parse(savedUsers);
        let savedCart = localStorage.getItem("prandium_cart");
        if(savedCart) cart = JSON.parse(savedCart);
        let savedNext = localStorage.getItem("prandium_nextOrderId");
        if(savedNext) nextOrderId = parseInt(savedNext);
        let savedUser = localStorage.getItem("prandium_currentUser");
        if(savedUser) currentUser = JSON.parse(savedUser);
    }

    // generate order code #001 - Name
    function generateOrderCode(userName) {
        let num = nextOrderId++;
        saveAllData();
        let padded = num.toString().padStart(3, '0');
        return `#${padded} - ${userName}`;
    }

    // add user if new
    function registerUserIfNeeded(name) {
        let existing = users.find(u => u.name.toLowerCase() === name.toLowerCase());
        if(existing) {
            currentUser = existing;
        } else {
            let newUser = {
                id: Date.now(),
                name: name,
                createdAt: new Date().toISOString(),
                bonus: 0,
                totalOrders: 0
            };
            users.push(newUser);
            currentUser = newUser;
            saveAllData();
        }
        renderProfileInfo();
    }

    // update bonus (5% cashback UI logic)
    function getUserBonus() {
        if(!currentUser) return 0;
        let totalSpent = 0;
        let userOrders = orders.filter(o => o.userId === currentUser.id);
        userOrders.forEach(o => { totalSpent += o.total });
        let bonus = Math.floor(totalSpent * 0.05);
        if(currentUser) currentUser.bonus = bonus;
        saveAllData();
        return bonus;
    }

    // Add to cart
    function addToCart(productId) {
        let product = menu.find(p => p.id === productId);
        if(!product || !product.available) return alert("Sold out or unavailable");
        let existing = cart.find(i => i.id === productId);
        if(existing) existing.quantity++;
        else cart.push({ ...product, quantity: 1 });
        saveAllData();
        renderCart();
    }

    function removeCartItem(index) {
        cart.splice(index,1);
        saveAllData();
        renderCart();
    }

    // render menu
    function renderMenu() {
        let container = document.getElementById("menuContainer");
        if(!container) return;
        container.innerHTML = menu.map(product => `
            <div class="food-card">
                <div class="food-img">${product.image}</div>
                <div class="food-info">
                    <div class="food-name">${product.name} ${!product.available ? '(sold out)' : ''}</div>
                    <div class="food-price">${product.price.toLocaleString()} UZS</div>
                </div>
                <button class="add-btn" ${!product.available ? 'disabled style="opacity:0.5"' : ''} onclick="addToCart(${product.id})">+ Add</button>
            </div>
        `).join('');
    }

    function renderCart() {
        let cartDiv = document.getElementById("cartItemsList");
        let totalSpan = document.getElementById("totalPrice");
        if(!cartDiv) return;
        if(cart.length === 0) {
            cartDiv.innerHTML = `<div style="text-align:center; padding:40px;">🛒 Savatcha bo'sh</div>`;
            totalSpan.innerText = "0 UZS";
            return;
        }
        let total = 0;
        cartDiv.innerHTML = cart.map((item, idx) => {
            let itemTotal = item.price * item.quantity;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <div><strong>${item.name}</strong> x${item.quantity}<br><span style="font-size:13px;">${item.price.toLocaleString()} UZS</span></div>
                    <div><button class="remove-item" style="background:#ddd; color:#333; padding:6px 12px;" onclick="removeCartItem(${idx})">Remove</button></div>
                </div>
            `;
        }).join('');
        totalSpan.innerText = total.toLocaleString() + " UZS";
    }

    // order creation after payment confirmation
    function createOrder(paymentMethod) {
        if(!currentUser) { alert("User not found"); return false; }
        if(cart.length === 0) { alert("Cart empty"); return false; }
        let items = cart.map(i => ({ name: i.name, quantity: i.quantity, price: i.price }));
        let total = cart.reduce((sum,i) => sum + i.price * i.quantity, 0);
        let orderCode = generateOrderCode(currentUser.name);
        let newOrder = {
            id: Date.now(),
            userId: currentUser.id,
            userName: currentUser.name,
            orderCode: orderCode,
            items: items,
            total: total,
            status: "pending",
            timestamp: new Date().toISOString(),
            payment: paymentMethod
        };
        orders.push(newOrder);
        currentUser.totalOrders = (currentUser.totalOrders || 0) + 1;
        cart = [];
        saveAllData();
        // send to Telegram WebApp if available
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.sendData(JSON.stringify({
                action: "new_order",
                order: newOrder
            }));
        }
        alert(`✅ Order ${orderCode} created! Status: pending`);
        renderCart();
        renderOrdersList();
        renderAdminOrders();
        renderUserOrders();
        renderProfileInfo();
        return true;
    }

    // external payment links
    function openPay(service) {
        if(cart.length===0) return alert("Cart empty");
        let total = cart.reduce((s,i) => s + i.price * i.quantity, 0);
        let link = "";
        if(service === 'click') link = `https://my.click.uz/services/pay?service_id=22797&merchant_id=12345&amount=${total}&currency=uzs`;
        else link = `https://payme.uz/pay?amount=${total}&m=60f3a4b0c5d8e2a4b8c9d0e1`;
        window.open(link, '_blank');
        alert("To'lovni tugatganingizdan so'ng 'I have paid' tugmasini bosing.");
    }

    document.getElementById("payClickBtn")?.addEventListener('click', () => openPay('click'));
    document.getElementById("payPaymeBtn")?.addEventListener('click', () => openPay('payme'));
    document.getElementById("confirmPaidBtn")?.addEventListener('click', () => {
        if(cart.length===0) return alert("Savatcha bo'sh");
        createOrder("click/payme");
        switchPage('home');
    });

    // Admin panel render
    function renderAdminPanel() {
        let area = document.getElementById("adminPanelArea");
        if(!adminMode) { area.style.display = "none"; return; }
        area.style.display = "block";
        let totalOrdersToday = orders.filter(o => {
            let today = new Date().toDateString();
            return new Date(o.timestamp).toDateString() === today;
        }).length;
        let totalRevenue = orders.reduce((sum,o) => sum + o.total, 0);
        let uniqueUsers = users.length;
        area.innerHTML = `
            <div class="admin-panel">
                <h3>🛠️ Admin Dashboard</h3>
                <div class="admin-stats">
                    <div class="stat-card">📦 Today orders <br><strong>${totalOrdersToday}</strong></div>
                    <div class="stat-card">💰 Revenue <br><strong>${totalRevenue.toLocaleString()} UZS</strong></div>
                    <div class="stat-card">👥 Users <br><strong>${uniqueUsers}</strong></div>
                </div>
                <h4>📋 Manage Products</h4>
                <div id="adminProductsList"></div>
                <button id="addProductBtn" style="background:#DA7B2C; border:none; padding:8px 16px; border-radius:40px; margin:12px 0; color:white;">+ Add new food</button>
                <hr>
                <h4>📦 Orders (manage status)</h4>
                <div id="adminOrdersList" class="order-list-admin"></div>
                <h4>👥 Registered users</h4>
                <div id="adminUsersList"></div>
            </div>
        `;
        renderAdminProducts();
        renderAdminOrders();
        renderAdminUsers();
        document.getElementById("addProductBtn")?.addEventListener('click', () => {
            let name = prompt("Food name");
            let price = parseInt(prompt("Price UZS"));
            if(name && price) {
                let newId = Date.now();
                menu.push({ id: newId, name, price, image: "🍲", available: true });
                saveAllData();
                renderMenu();
                renderAdminProducts();
            }
        });
    }

    function renderAdminProducts() {
        let container = document.getElementById("adminProductsList");
        if(!container) return;
        container.innerHTML = menu.map(p => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#f9f6f0; margin-bottom:8px; padding:8px 12px; border-radius:40px;">
                <span>${p.image} ${p.name} - ${p.price.toLocaleString()} UZS</span>
                <div>
                    <button class="status-btn" onclick="editProduct(${p.id})">✏️ Edit</button>
                    <button class="status-btn" onclick="toggleAvailable(${p.id})">${p.available ? "✔️ Available" : "⛔ Sold out"}</button>
                </div>
            </div>
        `).join('');
    }

    window.editProduct = (id) => {
        let prod = menu.find(p => p.id === id);
        let newPrice = prompt("New price UZS", prod.price);
        if(newPrice) prod.price = parseInt(newPrice);
        saveAllData();
        renderMenu();
        renderAdminProducts();
    };
    window.toggleAvailable = (id) => {
        let prod = menu.find(p => p.id === id);
        prod.available = !prod.available;
        saveAllData();
        renderMenu();
        renderAdminProducts();
    };

    function renderAdminOrders() {
        let container = document.getElementById("adminOrdersList");
        if(!container) return;
        container.innerHTML = orders.slice().reverse().map(o => `
            <div style="background:#f3f0ea; border-radius:20px; padding:12px; margin-bottom:10px;">
                <div><strong>${o.orderCode}</strong> | ${o.userName} | ${o.total.toLocaleString()} UZS</div>
                <div>Items: ${o.items.map(i=>i.name).join(', ')}</div>
                <div>Status: <span class="badge">${o.status}</span>
                    <button class="status-btn" onclick="updateOrderStatus('${o.id}', 'ready')">✅ Ready</button>
                    <button class="status-btn" onclick="updateOrderStatus('${o.id}', 'completed')">🎉 Completed</button>
                </div>
            </div>
        `).join('');
    }

    window.updateOrderStatus = (orderId, newStatus) => {
        let order = orders.find(o => o.id == orderId);
        if(order) order.status = newStatus;
        saveAllData();
        renderAdminOrders();
        renderUserOrders();
    };

    function renderAdminUsers() {
        let container = document.getElementById("adminUsersList");
        if(container) container.innerHTML = users.map(u => `<div>👤 ${u.name} | orders: ${u.totalOrders || 0} | bonus: ${getUserBonus()} UZS</div>`).join('');
    }

    function renderProfileInfo() {
        if(!currentUser) return;
        document.getElementById("profileName").innerText = currentUser.name;
        document.getElementById("profileUserId").innerText = currentUser.id;
        document.getElementById("userTotalOrders").innerText = currentUser.totalOrders || 0;
        document.getElementById("bonusDisplay").innerHTML = `🎁 Bonus: ${getUserBonus()} UZS (5% cashback)`;
        document.getElementById("userGreet").innerHTML = `👋 ${currentUser.name}, welcome!`;
        renderUserOrders();
    }

    function renderUserOrders() {
        let container = document.getElementById("userOrdersList");
        if(!container) return;
        let myOrders = orders.filter(o => o.userId === currentUser?.id).reverse();
        if(myOrders.length === 0) container.innerHTML = "<p>No orders yet</p>";
        else container.innerHTML = myOrders.map(o => `
            <div style="background:#f9f3e9; border-radius: 20px; margin-top: 12px; padding: 12px;">
                <strong>${o.orderCode}</strong>  |  ${o.total.toLocaleString()} UZS<br>
                Status: <span class="badge">${o.status}</span>
                <div style="font-size:13px;">📅 ${new Date(o.timestamp).toLocaleString()}</div>
            </div>
        `).join('');
    }

    function renderOrdersList() { renderUserOrders(); renderAdminOrders(); }

    // navigation and ask name first
    function askUserName() {
        if(currentUser) return true;
        let name = prompt("🍽️ Please enter your name to continue:", "Diyor");
        if(name && name.trim()) {
            registerUserIfNeeded(name.trim());
            renderMenu();
            renderCart();
            renderProfileInfo();
            return true;
        }
        return false;
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId + "Page").classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        if(pageId === 'home') document.querySelector('[data-nav="home"]').classList.add('active');
        if(pageId === 'cart') document.querySelector('[data-nav="cart"]').classList.add('active');
        if(pageId === 'profile') document.querySelector('[data-nav="profile"]').classList.add('active');
        if(pageId === 'home') renderAdminPanel();
        if(pageId === 'profile') renderProfileInfo();
        if(pageId === 'cart') renderCart();
    }

    // init event
    window.addEventListener('DOMContentLoaded', () => {
        loadAllData();
        if(!askUserName()) return;
        renderMenu();
        renderCart();
        renderProfileInfo();
        renderAdminPanel();
        renderOrdersList();
        // Toggle admin
        const toggleBtn = document.getElementById("toggleAdminBtn");
        toggleBtn.addEventListener('click', () => {
            adminMode = !adminMode;
            if(adminMode) toggleBtn.classList.add('active');
            else toggleBtn.classList.remove('active');
            renderAdminPanel();
        });
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let nav = btn.getAttribute('data-nav');
                if(nav === 'home') switchPage('home');
                if(nav === 'cart') switchPage('cart');
                if(nav === 'profile') switchPage('profile');
            });
        });
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    });
</script>
</body>
</html>
